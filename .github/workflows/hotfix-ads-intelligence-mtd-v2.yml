name: hotfix-ads-intelligence-mtd-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-ads-intelligence-mtd-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Ads Intelligence financial route and labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/ads-intelligence-inline-bridge.tsx')
          s = p.read_text()
          s2 = s.replace(
              'const API = `${SUPABASE_URL}/functions/v1/agency-ops-ads-intelligence-api`;',
              'const API = `${SUPABASE_URL}/functions/v1/agency-ops-ads-intelligence-api-v2`;'
          )
          s2 = s2.replace('<small>Gasto MTD</small>', '<small>Gasto no mês</small>')
          s2 = s2.replace('<span>acumulado do mês</span>', '<span>quanto já foi gasto no mês atual até agora</span>')
          old = 'pacing.source === "META_LIVE_PARTIAL" ? "Meta parcial" : "leitura protegida"'
          new = 'pacing.source === "META_LIVE_PARTIAL" ? "Meta parcial" : pacing.source === "UNAVAILABLE" ? "Meta indisponível" : "leitura protegida"'
          s2 = s2.replace(old, new)
          if s2 == s:
              raise SystemExit('Expected Ads Intelligence source patterns were not found or already patched.')
          p.write_text(s2)
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ads-intelligence-inline-bridge.tsx
          git commit -m "Fix Ads Intelligence MTD financial read"
          git push

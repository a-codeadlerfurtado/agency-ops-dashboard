name: Final ops consolidation

on:
  push:
    branches:
      - chatgpt/final-ops-consolidation-20260821-v5
    paths:
      - .github/workflows/final-ops-consolidation.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/final-ops-consolidation-20260821-v5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/final_ops_consolidation.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/views/creative.tsx supabase/functions/agency-ops-dashboard-api/index.ts supabase/migrations/20260821143500_work_center_solicitation_wording.sql
          git commit -m "fix: finalize profiles, ClickUp focus and work center"
          git push origin HEAD:chatgpt/final-ops-consolidation-20260821-v5

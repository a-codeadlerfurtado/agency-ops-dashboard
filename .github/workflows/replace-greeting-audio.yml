name: Replace greeting audio binary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-audio:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'stage full greeting audio final')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild exact Git binary patch
        shell: bash
        run: |
          set -euo pipefail
          cat .opsq/final-00 .opsq/final-01 .opsq/final-02 .opsq/final-03 > .opsq/replace-audio-complete.patch
          test "$(wc -c < .opsq/replace-audio-complete.patch)" = "56867"

      - name: Apply validated MP3 binary
        shell: bash
        run: |
          set -euo pipefail
          rm -f public/audio/opsquestion-greeting-full-v6.mp3
          git apply --binary .opsq/replace-audio-complete.patch
          test "$(wc -c < public/audio/opsquestion-greeting-full-v6.mp3)" = "45981"
          echo "a749d3a2fe4094b19a5c66925ae154170dd9e4aad77b228eb07070dc5598e0b0  public/audio/opsquestion-greeting-full-v6.mp3" | sha256sum -c -

      - name: Verify full audible MP3
        shell: bash
        run: |
          set -euo pipefail
          file="public/audio/opsquestion-greeting-full-v6.mp3"
          ffmpeg -v error -i "$file" -f null -
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$file")"
          python3 - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          assert 22.7 <= duration <= 23.0, duration
          PY
          volume="$(ffmpeg -hide_banner -i "$file" -af volumedetect -f null - 2>&1)"
          max_db="$(printf '%s\n' "$volume" | sed -n 's/.*max_volume: \([-0-9.]*\) dB.*/\1/p' | tail -1)"
          python3 - "$max_db" <<'PY'
          import sys
          max_db = float(sys.argv[1])
          assert max_db > -40.0, max_db
          PY
          silence="$(ffmpeg -hide_banner -i "$file" -af silencedetect=noise=-45dB:d=1.0 -f null - 2>&1 || true)"
          if printf '%s\n' "$silence" | grep -q 'silence_duration'; then
            echo "$silence"
            exit 1
          fi

      - name: Commit only final MP3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .opsq
          rm -f .github/workflows/replace-greeting-audio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace greeting MP3 binary only"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

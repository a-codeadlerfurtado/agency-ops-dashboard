name: Replace greeting audio binary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-audio:
    if: contains(github.event.head_commit.message, 'stage full greeting audio')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild binary patch
        shell: bash
        run: |
          set -euo pipefail
          cat .opsq/part-* > .opsq/replace-audio-complete.patch
      - name: Apply exact audio binary
        shell: bash
        run: |
          set -euo pipefail
          rm -f public/audio/opsquestion-greeting-full-v6.mp3
          git apply --binary .opsq/replace-audio-complete.patch
          test "$(wc -c < public/audio/opsquestion-greeting-full-v6.mp3)" = "45981"
          echo "a749d3a2fe4094b19a5c66925ae154170dd9e4aad77b228eb07070dc5598e0b0  public/audio/opsquestion-greeting-full-v6.mp3" | sha256sum -c -
      - name: Commit only final MP3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .opsq
          rm -f .github/workflows/replace-greeting-audio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace greeting MP3 binary only"
          git push

name: Final consolidated validation

on:
  push:
    branches:
      - chatgpt/diary-43-44-20260821
    paths:
      - .github/workflows/final-consolidated-validation.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/diary-43-44-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Mark validated head
        run: |
          printf '%s\n' "validated $(git rev-parse HEAD)" > .github/final-consolidated-validation.ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/final-consolidated-validation.ok
          git commit -m "chore: mark consolidated build validated"
          git push origin HEAD:chatgpt/diary-43-44-20260821


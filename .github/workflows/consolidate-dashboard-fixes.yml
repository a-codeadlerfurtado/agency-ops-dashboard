name: Consolidate dashboard fixes

on:
  push:
    branches:
      - chatgpt/diary-43-44-20260821
    paths:
      - .github/workflows/consolidate-dashboard-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/diary-43-44-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply consolidated fixes
        run: python scripts/consolidate_dashboard_fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build Cloudflare bundle
        run: npm run build
      - name: Commit validated fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx supabase/functions/agency-ops-dashboard-api/index.ts
          git commit -m "fix: consolidate profile, focus and workflow corrections"
          git push origin HEAD:chatgpt/diary-43-44-20260821


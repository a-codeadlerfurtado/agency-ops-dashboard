name: Deploy Briefing Hub presentation Worker

on:
  push:
    branches:
      - briefing-hub-drive-deploy-20260901
    paths:
      - '.github/workflows/briefing-hub-presentation-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        env_name: [production, Production, cloudflare, Cloudflare, workers, Workers, deploy, Deploy]
    environment: ${{ matrix.env_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || 'c3e4211c99f0c7d71701a6f59a23befb' }}
      WORKER_NAME: agency-briefing-hub-presentation
      PUBLIC_URL: https://agency-briefing-hub-presentation.lakassessoriadigital.workers.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe Cloudflare credential
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "access=false" >> "$GITHUB_OUTPUT"
            echo "No token in ${{ matrix.env_name }}"
            exit 0
          fi
          HTTP=$(curl -sS -o /tmp/cf.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/agency-briefing-hub/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$HTTP" = "200" ] && jq -e '.success == true' /tmp/cf.json >/dev/null 2>&1; then
            echo "access=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare access available in ${{ matrix.env_name }}"
          else
            echo "access=false" >> "$GITHUB_OUTPUT"
            echo "Credential present but cannot manage target account in ${{ matrix.env_name }}"
          fi

      - name: Build isolated presentation Worker from validated demo layer
        if: steps.auth.outputs.access == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:app/briefing-hub-demo/route.ts > /tmp/demo-route.ts
          python - <<'PY'
          from pathlib import Path
          import json, re
          src = Path('/tmp/demo-route.ts').read_text(encoding='utf-8')
          m_script = re.search(r'const DEMO_SCRIPT = String\.raw`(.*?)`;\s*\n\s*const DEMO_STYLE', src, re.S)
          m_style = re.search(r'const DEMO_STYLE = String\.raw`(.*?)`;\s*\n\s*function injectPresentationMode', src, re.S)
          if not m_script or not m_style:
              raise SystemExit('Could not extract validated presentation layer from main')
          script = m_script.group(1)
          style = m_style.group(1)
          worker = f'''const PRIMARY = "https://agency-briefing-hub.lakassessoriadigital.workers.dev/cliente";
const DEMO_SCRIPT = {json.dumps(script, ensure_ascii=False)};
const DEMO_STYLE = {json.dumps(style, ensure_ascii=False)};
function inject(html) {{
  let out = html.replace(/<title>Briefing Hub<\\/title>/i, "<title>Briefing Hub · Modo apresentação</title>");
  const payload = DEMO_STYLE + "<script>" + DEMO_SCRIPT + "<\\/script>";
  if (/<body[^>]*>/i.test(out)) return out.replace(/<body[^>]*>/i, m => m + payload);
  return out.replace(/<\\/head>/i, payload + "</head>");
}}
export default {{
  async fetch(request) {{
    const url = new URL(request.url);
    if (request.method !== "GET" || (url.pathname !== "/" && url.pathname !== "/apresentacao" && url.pathname !== "/cliente")) return new Response("Not found", {{status:404}});
    const upstream = await fetch(PRIMARY, {{headers:{{accept:"text/html,application/xhtml+xml"}}}});
    if (!upstream.ok) return new Response("Briefing Hub indisponível", {{status:502}});
    return new Response(inject(await upstream.text()), {{status:200,headers:{{"content-type":"text/html; charset=utf-8","cache-control":"no-store, no-cache, must-revalidate","x-robots-tag":"noindex, nofollow","referrer-policy":"no-referrer"}}}});
  }}
}};
'''
          Path('/tmp/presentation-worker.mjs').write_text(worker, encoding='utf-8')
          print('worker_bytes=', len(worker.encode('utf-8')))
          PY

      - name: Deploy to Cloudflare Workers
        if: steps.auth.outputs.access == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy /tmp/presentation-worker.mjs --name "$WORKER_NAME" --compatibility-date 2026-09-02

      - name: Verify public Cloudflare URL
        if: steps.auth.outputs.access == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -L -sS -o /tmp/live.html -w '%{http_code}' "$PUBLIC_URL" || true)
            if [ "$CODE" = "200" ] && grep -q 'Briefing Hub' /tmp/live.html && grep -q 'bh-demo-badge' /tmp/live.html; then
              echo "PRESENTATION_URL=$PUBLIC_URL"
              echo "HTTP=200"
              exit 0
            fi
            sleep 5
          done
          echo "Presentation Worker did not become healthy" >&2
          head -c 500 /tmp/live.html || true
          exit 1

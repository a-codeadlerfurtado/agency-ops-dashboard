name: Temporary auth session fix

on:
  push:
    branches: [fix/auth-session-storm]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply auth singleton fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-session-storm
      - name: Patch auth session handling
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          top_level = [
              "app/weekend-balance-alert.tsx",
              "app/lead-quality-alert.tsx",
              "app/campaign-notes-bridge.tsx",
              "app/integration-health-bar.tsx",
          ]
          for path in top_level:
              replace(path,
                  'import { createClient, type Session } from "@supabase/supabase-js";',
                  'import type { Session } from "@supabase/supabase-js";\nimport { SUPABASE_URL, SUPABASE_ANON_KEY, supabase } from "./shared";')
              replace(path,
                  'const SUPABASE_URL = "https://bfzdetibfcwihfkltbkp.supabase.co";\nconst SUPABASE_ANON_KEY = "sb_publishable_mHdRMLiKvTHqB7q9tAnq2A_64VOrwU7";\n',
                  '')
              replace(path,
                  'const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);\n',
                  '')

          nested = [
              ("app/campaigns/page.tsx", "../shared"),
              ("app/campaigns/leads/page.tsx", "../../shared"),
          ]
          for path, shared_path in nested:
              replace(path,
                  'import { createClient, type Session } from "@supabase/supabase-js";',
                  f'import type {{ Session }} from "@supabase/supabase-js";\nimport {{ SUPABASE_URL, SUPABASE_ANON_KEY, supabase }} from "{shared_path}";')
              replace(path,
                  'const SUPABASE_URL = "https://bfzdetibfcwihfkltbkp.supabase.co";\nconst SUPABASE_ANON_KEY = "sb_publishable_mHdRMLiKvTHqB7q9tAnq2A_64VOrwU7";\n',
                  '')
              replace(path,
                  'const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);\n',
                  '')

          p = Path("app/shared.tsx")
          text = p.read_text()
          replacements = [
            ('// Todas as chamadas autenticadas passam por esta camada. O token recebido pelos\n// componentes serve apenas para compatibilidade com as assinaturas antigas; antes de\n// sair para a rede consultamos a sessao atual do Supabase. Assim, uma aba antiga que\n// ficou com um access token em um closure para imediatamente de bater nas APIs depois\n// de logout. Se o access token apenas venceu, fazemos UM refresh compartilhado e\n// repetimos a requisicao uma unica vez.\nlet refreshSessionPromise: Promise<string | null> | null = null;',
             '// Todas as chamadas autenticadas passam por esta camada. Chamadas que ja possuem\n// o token da sessao usam esse token diretamente; as demais compartilham uma unica\n// leitura de sessao concorrente. Refresh so acontece depois de um 401 real e tambem\n// e compartilhado. Isso evita tempestade de getSession/refresh durante a montagem.\nlet accessTokenPromise: Promise<string | null> | null = null;\nlet refreshSessionPromise: Promise<string | null> | null = null;'),
            ('async function liveAccessToken(): Promise<string | null> {\n  const { data, error } = await supabase.auth.getSession();\n  if (error) return null;\n  return data.session?.access_token ?? null;\n}',
             'async function liveAccessToken(): Promise<string | null> {\n  if (!accessTokenPromise) {\n    accessTokenPromise = supabase.auth.getSession()\n      .then(({ data, error }) => error ? null : (data.session?.access_token ?? null))\n      .finally(() => { accessTokenPromise = null; });\n  }\n  return accessTokenPromise;\n}'),
            ('export async function authenticatedFetch(input: RequestInfo | URL, init: RequestInit = {}): Promise<Response> {\n  const currentToken = await liveAccessToken();',
             'export async function authenticatedFetch(input: RequestInfo | URL, init: RequestInit = {}, tokenHint?: string | null): Promise<Response> {\n  const currentToken = tokenHint || await liveAccessToken();'),
            ('export async function api(view: string, _token: string, params: Record<string, string> = {}) {',
             'export async function api(view: string, token: string, params: Record<string, string> = {}) {'),
            ('  const response = await authenticatedFetch(url, { cache: "no-store" });',
             '  const response = await authenticatedFetch(url, { cache: "no-store" }, token);'),
            ('      const clientResponse = await authenticatedFetch(CS_CLIENTS_API, { cache: "no-store" });',
             '      const clientResponse = await authenticatedFetch(CS_CLIENTS_API, { cache: "no-store" }, token);'),
            ('export async function apiPost(view: string, _token: string, body: Row = {}) {',
             'export async function apiPost(view: string, token: string, body: Row = {}) {'),
            ('  const response = await authenticatedFetch(endpoint, {\n    method: "POST",\n    headers: { "content-type": "application/json" },\n    body: JSON.stringify(body),\n  });',
             '  const response = await authenticatedFetch(endpoint, {\n    method: "POST",\n    headers: { "content-type": "application/json" },\n    body: JSON.stringify(body),\n  }, token);'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"shared pattern not found: {old[:100]!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Verify patch shape
        run: |
          echo 'Remaining app createClient calls:'
          grep -R 'createClient(SUPABASE_URL, SUPABASE_ANON_KEY)' app --include='*.tsx' --include='*.ts' || true
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "a-codeadlerfurtado"
          git config user.email "adlerfurtadomkt01@gmail.com"
          git add app/shared.tsx app/weekend-balance-alert.tsx app/lead-quality-alert.tsx app/campaign-notes-bridge.tsx app/integration-health-bar.tsx app/campaigns/page.tsx app/campaigns/leads/page.tsx
          git commit -m "Apply auth singleton fix"
          git push origin HEAD:fix/auth-session-storm

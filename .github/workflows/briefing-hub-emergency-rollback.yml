name: Emergency Briefing Hub rollback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/briefing-hub-emergency-rollback.yml'

permissions:
  contents: read

jobs:
  browser-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify login button in real browser
        run: |
          set -euo pipefail
          python -m pip install -q selenium
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1000')
          driver = webdriver.Chrome(options=opts)
          try:
              driver.get('https://agency-briefing-hub.lakassessoriadigital.workers.dev/cliente')
              wait = WebDriverWait(driver, 20)
              user = wait.until(EC.visibility_of_element_located((By.NAME, 'username')))
              password = driver.find_element(By.NAME, 'password')
              button = driver.find_element(By.CSS_SELECTOR, '.auth-submit')
              user.send_keys('__browser_smoke_invalid__')
              password.send_keys('__browser_smoke_invalid__')
              button.click()
              wait.until(lambda d: 'invalid_credentials' in d.find_element(By.ID, 'er').text)
              print('LOGIN_BUTTON_HANDLER_OK')
              print('ERROR_TEXT=' + driver.find_element(By.ID, 'er').text)
              print('URL=' + driver.current_url)
              print('CONSOLE=' + str(driver.get_log('browser') if hasattr(driver, 'get_log') else []))
          finally:
              driver.quit()
          PY

  rollback-briefing-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Roll back only agency-briefing-hub to stable v26
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "No Cloudflare API token secret is configured under the expected names."
            exit 2
          fi

          RESPONSE=$(curl -sS --fail-with-body \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/c3e4211c99f0c7d71701a6f59a23befb/workers/scripts/agency-briefing-hub/deployments" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"strategy":"percentage","versions":[{"version_id":"fe97df34-7527-4389-b353-3cd4ead60b05","percentage":100}],"annotations":{"workers/message":"Emergency rollback Briefing Hub to stable v26 after v44 login regression; agency-ops-dashboard untouched"}}')

          echo "$RESPONSE" | jq -e '.success == true' >/dev/null
          DEPLOYMENT_ID=$(echo "$RESPONSE" | jq -r '.result.id // empty')
          test -n "$DEPLOYMENT_ID"
          echo "Briefing Hub rollback deployment created: $DEPLOYMENT_ID"

      - name: Smoke test public login page
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 \
              "https://agency-briefing-hub.lakassessoriadigital.workers.dev/cliente" \
              -o /tmp/briefing-client.html; then
              break
            fi
            sleep 3
          done
          test -s /tmp/briefing-client.html
          grep -qi "Briefing Hub" /tmp/briefing-client.html
          grep -qi "Entrar" /tmp/briefing-client.html
          echo "Public login page is responding after rollback."

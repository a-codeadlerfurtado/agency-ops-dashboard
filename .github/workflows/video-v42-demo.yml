name: Video V4.2 Cinematic Demo

on:
  push:
    branches:
      - feat/video-engine-v4
    paths:
      - 'vps/video-worker-v4/director_v42.py'
      - 'vps/video-worker-v4/worker_v42.py'
      - 'vps/video-worker-v4/demo_v42_local.py'
      - '.github/workflows/video-v42-demo.yml'
  workflow_dispatch:

jobs:
  render-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO_WORK_DIR: /tmp/video-v42-work
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download public real-estate footage
        run: |
          mkdir -p /tmp/v42-demo
          curl -L --fail --retry 3 -o /tmp/v42-demo/src1.mp4 'https://videos.pexels.com/video-files/36516351/15483420_2160_3840_60fps.mp4'
          curl -L --fail --retry 3 -o /tmp/v42-demo/src2.mp4 'https://videos.pexels.com/video-files/36516358/15483456_2160_3840_60fps.mp4'
          curl -L --fail --retry 3 -o /tmp/v42-demo/src3.mp4 'https://videos.pexels.com/video-files/36516349/15483596_2160_3840_60fps.mp4'

      - name: Prepare clean 14-second source windows
        run: |
          for i in 1 2 3; do
            ffmpeg -hide_banner -loglevel error -y -i /tmp/v42-demo/src${i}.mp4 -t 14 -an -vf "fps=30,scale=1080:1920:flags=lanczos" -c:v libx264 -preset veryfast -crf 21 /tmp/v42-demo/clip${i}.mp4
          done

      - name: Run V4.2 creative director and renderer
        working-directory: vps/video-worker-v4
        run: |
          mkdir -p /tmp/video-v42-work /tmp/v42-out
          python demo_v42_local.py /tmp/v42-out/V42_CINEMATIC_DEMO_SILENT.mp4 /tmp/v42-demo/clip1.mp4 /tmp/v42-demo/clip2.mp4 /tmp/v42-demo/clip3.mp4

      - name: Add restrained cinematic ambience
        run: |
          curl -L --fail --retry 3 -o /tmp/v42-demo/music.mp3 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b5f8f3b5.mp3?filename=cinematic-atmosphere-ambient-110290.mp3'
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/v42-out/V42_CINEMATIC_DEMO_SILENT.mp4 \
            -stream_loop -1 -i /tmp/v42-demo/music.mp3 \
            -filter_complex "[1:a]atrim=duration=18,asetpts=PTS-STARTPTS,volume=0.20,afade=t=in:st=0:d=0.45,afade=t=out:st=16.2:d=1.8[m];[0:a][m]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.90[a]" \
            -map 0:v -map '[a]' -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest \
            /tmp/v42-out/V42_CINEMATIC_DEMO.mp4

      - name: Final validation
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json /tmp/v42-out/V42_CINEMATIC_DEMO.mp4 | tee /tmp/v42-out/V42_FINAL_FFPROBE.json
          test -s /tmp/v42-out/V42_CINEMATIC_DEMO.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: V42-cinematic-demo
          path: |
            /tmp/v42-out/V42_CINEMATIC_DEMO.mp4
            /tmp/v42-out/V42_DEMO_TIMELINE.json
            /tmp/v42-out/V42_DEMO_QA.json
            /tmp/v42-out/V42_FINAL_FFPROBE.json
          if-no-files-found: error
          retention-days: 7

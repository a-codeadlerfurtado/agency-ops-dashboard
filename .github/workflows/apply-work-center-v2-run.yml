name: Apply work center v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-work-center-v2-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/patch_work_center_v2.py
      - name: Commit patch
        run: |
          git config user.name "ops-dashboard-bot"
          git config user.email "ops-dashboard-bot@users.noreply.github.com"
          git add app/dashboard-native.tsx
          git commit -m "feat: upgrade work center operational dispatch"
          git push origin HEAD:main

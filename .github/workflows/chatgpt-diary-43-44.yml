name: ChatGPT Diary 43 44 validation

on:
  push:
    branches:
      - chatgpt/diary-43-44-20260821

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/diary-43-44-20260821
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Connect structured Diary view
        shell: python
        run: |
          from pathlib import Path
          page = Path('app/page.tsx')
          s = page.read_text()
          import_anchor = 'import { PortfolioCenter } from "./views/portfolio";'
          import_line = 'import { DiaryCenter as StructuredDiaryCenter } from "./views/diary";'
          if import_line not in s:
              if s.count(import_anchor) != 1: raise SystemExit('portfolio import anchor not unique')
              s = s.replace(import_anchor, import_anchor + '\n' + import_line, 1)
          call_anchor = '<DiaryCenter clients={data.clients} adjustments={data.adjustments || []} taskLog={data.operations?.task_log || {}} profile={data.profile || {}} token={session!.access_token} reload={load} />'
          call_new = '<StructuredDiaryCenter clients={data.clients} adjustments={data.adjustments || []} taskLog={data.operations?.task_log || {}} profile={data.profile || {}} token={session!.access_token} reload={load} />'
          if call_new not in s:
              if s.count(call_anchor) != 1: raise SystemExit(f'diary call anchor count={s.count(call_anchor)}')
              s = s.replace(call_anchor, call_new, 1)
          page.write_text(s)

          diary = Path('app/views/diary.tsx')
          d = diary.read_text().replace('import { Chip, SUPABASE_ANON_KEY, SUPABASE_URL, formatDate, text } from "../shared";', 'import { SUPABASE_ANON_KEY, SUPABASE_URL, formatDate, text } from "../shared";')
          diary.write_text(d)
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/views/diary.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect isolated structured Diary"
          git push origin HEAD:chatgpt/diary-43-44-20260821

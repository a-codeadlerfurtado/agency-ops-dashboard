name: Temporary remove home promise cache

on:
  push:
    branches: [fix/remove-home-promise-cache]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-home-promise-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify greeting audio untouched
        run: git diff --exit-code origin/main -- app/greeting-audio-bridge.tsx
      - name: Build production
        run: |
          npm ci
          npm run build
      - name: Mark successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "validated $(git rev-parse HEAD)" > .home-cache-build-ok
          git add .home-cache-build-ok
          git commit -m "test: mark home cache build successful"
          git push origin HEAD:fix/remove-home-promise-cache

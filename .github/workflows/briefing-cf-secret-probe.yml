name: Briefing Cloudflare Credential Probe

on:
  push:
    branches:
      - briefing-hub-drive-integration-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && echo "CLOUDFLARE_API_TOKEN=true" || echo "CLOUDFLARE_API_TOKEN=false"
          test -n "$CF_API_TOKEN" && echo "CF_API_TOKEN=true" || echo "CF_API_TOKEN=false"
          test -n "$CLOUDFLARE_ACCOUNT_ID" && echo "CLOUDFLARE_ACCOUNT_ID=true" || echo "CLOUDFLARE_ACCOUNT_ID=false"
          test -n "$CF_ACCOUNT_ID" && echo "CF_ACCOUNT_ID=true" || echo "CF_ACCOUNT_ID=false"

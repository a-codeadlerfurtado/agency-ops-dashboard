name: One-time native video scripts tab

on:
  push:
    paths:
      - .github/workflows/one-time-native-video-scripts.yml

permissions:
  contents: write

jobs:
  promote-native-tab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote video scripts into native navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  print(f"{label}: already applied")
                  return
              if old not in text:
                  raise SystemExit(f"{label}: anchor not found in {path}")
              p.write_text(text.replace(old, new, 1))
              print(f"{label}: applied")

          # Native operational dashboard: real View item + real content renderer.
          replace_once(
              "app/dashboard-native.tsx",
              'const CreativeCenter = lazy(() => import("./views/creative").then((m) => ({ default: m.CreativeCenter })));',
              'const CreativeCenter = lazy(() => import("./views/creative").then((m) => ({ default: m.CreativeCenter })));\nconst VideoScriptsCenter = lazy(() => import("./views/video-scripts").then((m) => ({ default: m.VideoScriptsCenter })));',
              "dashboard import",
          )
          replace_once(
              "app/dashboard-native.tsx",
              '["clients", "Clientes"], ["creative", "Central Criativa"], ["health", "Saúde"]',
              '["clients", "Clientes"], ["creative", "Central Criativa"], ["scripts" as View, "Produção de Roteiros"], ["health", "Saúde"]',
              "dashboard nav item",
          )
          replace_once(
              "app/dashboard-native.tsx",
              '{view === "creative" && canSee("creative") && <Suspense fallback={<div className="auth-loading"><span className="dot loading"/> Carregando Central Criativa…</div>}><CreativeCenter token={session.access_token} /></Suspense>}',
              '{view === "creative" && canSee("creative") && <Suspense fallback={<div className="auth-loading"><span className="dot loading"/> Carregando Central Criativa…</div>}><CreativeCenter token={session.access_token} /></Suspense>}\n      {view === ("scripts" as View) && canSee("scripts" as View) && <Suspense fallback={<div className="auth-loading"><span className="dot loading"/> Carregando Produção de Roteiros…</div>}><VideoScriptsCenter token={session.access_token} /></Suspense>}',
              "dashboard scripts renderer",
          )

          # Leonardo has his own native shell, so the same feature is a native tab there too.
          replace_once(
              "app/leonardo-native-dashboard.tsx",
              'const CreativeCenter = lazy(() => import("./views/creative").then((m) => ({ default: m.CreativeCenter })));',
              'const CreativeCenter = lazy(() => import("./views/creative").then((m) => ({ default: m.CreativeCenter })));\nconst VideoScriptsCenter = lazy(() => import("./views/video-scripts").then((m) => ({ default: m.VideoScriptsCenter })));',
              "leonardo import",
          )
          replace_once(
              "app/leonardo-native-dashboard.tsx",
              'type Tab = "home" | "funnel" | "clients" | "campaigns" | "meetings" | "direction" | "creative" | "clickup";',
              'type Tab = "home" | "funnel" | "clients" | "campaigns" | "meetings" | "direction" | "creative" | "scripts" | "clickup";',
              "leonardo tab type",
          )
          replace_once(
              "app/leonardo-native-dashboard.tsx",
              '  { key: "creative", label: "Central Criativa", tab: "creative" },',
              '  { key: "creative", label: "Central Criativa", tab: "creative" },\n  { key: "scripts", label: "Produção de Roteiros", tab: "scripts" },',
              "leonardo nav item",
          )
          p = Path("app/leonardo-native-dashboard.tsx")
          text = p.read_text()
          text = text.replace('if (tab === "creative") { setLoading(false); return; }', 'if (tab === "creative" || tab === "scripts") { setLoading(false); return; }')
          text = text.replace('if (tab === "creative") return;', 'if (tab === "creative" || tab === "scripts") return;')
          text = text.replace(
              'if (tab === "creative") return <Suspense fallback={<div className="auth-loading"><span className="dot loading"/> Carregando Central Criativa…</div>}><CreativeCenter token={token} /></Suspense>;',
              'if (tab === "creative") return <Suspense fallback={<div className="auth-loading"><span className="dot loading"/> Carregando Central Criativa…</div>}><CreativeCenter token={token} /></Suspense>;\n  if (tab === "scripts") return <Suspense fallback={<div className="auth-loading"><span className="dot loading"/> Carregando Produção de Roteiros…</div>}><VideoScriptsCenter token={token} /></Suspense>;'
          )
          text = text.replace('tab !== "creative" ? <div className="auth-loading"', '!(["creative", "scripts"] as Tab[]).includes(tab) ? <div className="auth-loading"')
          p.write_text(text)

          # Old DOM-injected implementation is removed from the global layout.
          p = Path("app/layout.tsx")
          text = p.read_text()
          for line in [
              'import VideoScriptsBridge from "./video-scripts-bridge";\n',
              'import VideoScriptsNavPersistence from "./video-scripts-nav-persistence";\n',
              '        <VideoScriptsBridge />\n',
              '        <VideoScriptsNavPersistence />\n',
          ]:
              text = text.replace(line, "")
          p.write_text(text)

          # Native icon rule, same mechanism used by the other native menu buttons.
          replace_once(
              "app/nav-brand-icons.tsx",
              '  [\'[title^="Central Criativa"], [title="Inteligência Criativa"], [title="Inteligencia Criativa"]\', "palette"],',
              '  [\'[title^="Central Criativa"], [title="Inteligência Criativa"], [title="Inteligencia Criativa"]\', "palette"],\n  [\'[title^="Produção de Roteiros"], [title^="Producao de Roteiros"]\', "file"],',
              "native scripts icon",
          )

          # The centralized sidebar IA already groups this label under CRIATIVO.
          # Remove the obsolete injectors so there is only one source of truth.
          for obsolete in ["app/video-scripts-bridge.tsx", "app/video-scripts-nav-persistence.tsx"]:
              path = Path(obsolete)
              if path.exists():
                  path.unlink()
                  print(f"removed {obsolete}")

          # This workflow is intentionally one-shot.
          Path(".github/workflows/one-time-native-video-scripts.yml").unlink()
          PY

      - name: Typecheck
        run: npm ci && npm run typecheck

      - name: Commit native implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make video scripts a native dashboard tab"
          git push origin HEAD:main

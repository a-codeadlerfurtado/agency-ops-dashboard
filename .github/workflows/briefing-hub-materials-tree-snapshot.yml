name: Probe Cloudflare access for external Briefing Hub

on:
  push:
    branches:
      - briefing-hub-materials-tree-20260902
    paths:
      - '.github/workflows/briefing-hub-materials-tree-snapshot.yml'

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.env_name }})
    strategy:
      fail-fast: false
      matrix:
        env_name: [production, Production, cloudflare, Cloudflare, workers, Workers, deploy, Deploy]
    environment: ${{ matrix.env_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || 'c3e4211c99f0c7d71701a6f59a23befb' }}
    steps:
      - name: Probe without exposing credentials
        shell: bash
        run: |
          set +e
          TOKEN_PRESENT=false
          HTTP=none
          ACCESS_OK=false
          if [ -n "${CF_API_TOKEN:-}" ]; then
            TOKEN_PRESENT=true
            HTTP=$(curl -sS -o /tmp/cf.json -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/agency-briefing-hub/deployments" \
              -H "Authorization: Bearer $CF_API_TOKEN")
            if [ "$HTTP" = "200" ] && jq -e '.success == true' /tmp/cf.json >/dev/null 2>&1; then ACCESS_OK=true; fi
          fi
          {
            echo "### External Briefing Hub Cloudflare probe"
            echo "- environment: ${{ matrix.env_name }}"
            echo "- token_present: $TOKEN_PRESENT"
            echo "- http: $HTTP"
            echo "- access_ok: $ACCESS_OK"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "environment=${{ matrix.env_name }} token_present=$TOKEN_PRESENT http=$HTTP access_ok=$ACCESS_OK"
          exit 0

name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Validate AI server
        working-directory: server
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
      - name: Build
        run: npm run build

  publish-system-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout commit metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build patch-note payload
        run: node scripts/build-system-update-payload.mjs /tmp/system-update-payload.json
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agency-ops-system-updates" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Register system update
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/system-update-payload.json \
            https://bfzdetibfcwihfkltbkp.supabase.co/functions/v1/agency-ops-system-update-ingest-api

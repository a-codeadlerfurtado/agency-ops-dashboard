name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Apply diary 43/44 patch
        shell: python
        run: |
          from pathlib import Path
          import re

          shared = Path('app/shared.tsx')
          shared_text = shared.read_text()
          old_api = 'export const API_URL = `${SUPABASE_URL}/functions/v1/agency-ops-dashboard-api`;'
          new_api = 'export const API_URL = `${SUPABASE_URL}/functions/v1/agency-ops-dashboard-gateway`;'
          if old_api in shared_text:
              shared.write_text(shared_text.replace(old_api, new_api, 1))
          elif new_api not in shared_text:
              raise SystemExit('API_URL anchor not found')

          page = Path('app/page.tsx')
          text = page.read_text()
          component = r'''function DiaryCenter({ clients: _clients, adjustments: _adjustments, taskLog: _taskLog, profile: _profile, token, reload: _reload }: { clients: Row[]; adjustments: Row[]; taskLog: Row; profile: Row; token: string; reload: () => Promise<void> }) {
            const [tab, setTab] = useState<"ajustes" | "tasklog">("ajustes");
            const [scope, setScope] = useState<"mine" | "all">("mine");
            const [diary, setDiary] = useState<Row>({ adjustments: [], task_log: [], clients: [], categories: [], subcategories: [], staff: [], counts: { adjustments: 0, tasks: 0 } });
            const [loadingDiary, setLoadingDiary] = useState(true);
            const [diaryError, setDiaryError] = useState("");
            const [filters, setFilters] = useState<Row>({ author_user_id: "", client_id: "", category_code: "", subcategory_code: "", responsible_area: "", status: "", since: "", until: "" });
            const [adjClient, setAdjClient] = useState("");
            const [adjOccurred, setAdjOccurred] = useState(() => {
              const now = new Date(); const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000); return local.toISOString().slice(0, 16);
            });
            const [adjCategory, setAdjCategory] = useState("");
            const [adjSubcategory, setAdjSubcategory] = useState("");
            const [adjOrigin, setAdjOrigin] = useState("");
            const [adjDescription, setAdjDescription] = useState("");
            const [adjReason, setAdjReason] = useState("");
            const [adjArea, setAdjArea] = useState("");
            const [adjSeverity, setAdjSeverity] = useState("");
            const [adjStatus, setAdjStatus] = useState("OPEN");
            const [adjResolution, setAdjResolution] = useState("");
            const [adjRecurrent, setAdjRecurrent] = useState(false);
            const [adjSaving, setAdjSaving] = useState(false);
            const [adjError, setAdjError] = useState("");
            const [taskCategory, setTaskCategory] = useState("");
            const [taskName, setTaskName] = useState("");
            const [taskDate, setTaskDate] = useState(() => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10));
            const [taskSaving, setTaskSaving] = useState(false);
            const [taskError, setTaskError] = useState("");

            const loadDiary = useCallback(async () => {
              setLoadingDiary(true); setDiaryError("");
              try {
                const params: Record<string, string> = { scope };
                if (scope === "all") Object.entries(filters).forEach(([key, value]) => { if (String(value || "").trim()) params[key] = String(value); });
                const result = await api("diary", token, params);
                setDiary(result || {});
                if (scope === "all" && !result?.can_view_all) setScope("mine");
              } catch (error) { setDiaryError(error instanceof Error ? error.message : "Não foi possível carregar o Diário."); }
              finally { setLoadingDiary(false); }
            }, [filters, scope, token]);

            useEffect(() => { loadDiary(); }, [loadDiary]);

            const categories = diary.categories || [];
            const subcategories = diary.subcategories || [];
            const categorySubs = subcategories.filter((row: Row) => row.category_code === adjCategory);
            const filterSubs = subcategories.filter((row: Row) => !filters.category_code || row.category_code === filters.category_code);
            const clients = diary.clients || [];
            const adjustments = diary.adjustments || [];
            const tasks = diary.task_log || [];
            const canViewAll = Boolean(diary.can_view_all);
            const counts = diary.counts || { adjustments: adjustments.length, tasks: tasks.length };
            const origins: [string, string][] = [["CLIENT","Cliente"],["CS","CS"],["GT","Gestor de Tráfego"],["DESIGN","Designer"],["OPS","Operações"],["COMMERCIAL","Comercial"],["INTERNAL_AUDIT","Auditoria interna"],["OTHER","Outro"]];
            const areas: [string, string][] = [["DESIGN","Design"],["TRAFFIC","Tráfego"],["CS","CS"],["OPS","Operações"],["COMMERCIAL","Comercial"],["DEVELOPMENT","Desenvolvimento"],["CLIENT","Cliente"],["EXTERNAL","Externo"]];
            const statuses: [string, string][] = [["OPEN","Aberto"],["IN_PROGRESS","Em correção"],["RESOLVED","Resolvido"],["DISCARDED","Descartado"]];
            const severity: [string, string][] = [["LOW","Baixo"],["MEDIUM","Médio"],["HIGH","Alto"],["CRITICAL","Crítico"]];
            const statusLabel = (value: unknown) => statuses.find(([code]) => code === value)?.[1] || (value === "LEGACY_UNKNOWN" ? "Legado · classificação incompleta" : text(value));
            const originLabel = (value: unknown) => origins.find(([code]) => code === value)?.[1] || text(value);
            const areaLabel = (value: unknown) => areas.find(([code]) => code === value)?.[1] || text(value);

            async function submitAdjustment() {
              setAdjError("");
              if (!adjClient || !adjOccurred || !adjCategory || !adjSubcategory || !adjOrigin || !adjDescription.trim() || !adjReason.trim()) {
                setAdjError("Preencha Cliente, Data do ajuste, Categoria, Motivo, Origem, o que foi ajustado e por que precisou ser ajustado."); return;
              }
              const occurred = new Date(adjOccurred); if (Number.isNaN(occurred.getTime())) { setAdjError("Data do ajuste inválida."); return; }
              setAdjSaving(true);
              try {
                await apiPost("adjustment-create", token, { client_id: adjClient, occurred_at: occurred.toISOString(), category_code: adjCategory, subcategory_code: adjSubcategory, request_origin: adjOrigin, description: adjDescription.trim(), reason: adjReason.trim(), responsible_area: adjArea || null, severity: adjSeverity || null, status: adjStatus, resolution: adjResolution.trim() || null, is_recurrent: adjRecurrent });
                setAdjDescription(""); setAdjReason(""); setAdjResolution(""); setAdjRecurrent(false); setAdjStatus("OPEN"); setAdjSeverity(""); setAdjArea("");
                await loadDiary();
              } catch (error) { setAdjError(error instanceof Error ? error.message : "Não foi possível registrar o ajuste."); }
              finally { setAdjSaving(false); }
            }

            async function submitTask() {
              setTaskError(""); if (!taskCategory.trim() || !taskName.trim()) { setTaskError("Informe a categoria e a atividade executada."); return; }
              setTaskSaving(true);
              try { await apiPost("tasklog-create", token, { category: taskCategory.trim(), task_name: taskName.trim(), task_date: taskDate }); setTaskName(""); await loadDiary(); }
              catch (error) { setTaskError(error instanceof Error ? error.message : "Não foi possível registrar no TaskLog."); }
              finally { setTaskSaving(false); }
            }

            async function resolveAdjustment(entry: Row) {
              const resolution = window.prompt("Como este ajuste foi resolvido?", entry.resolution || ""); if (resolution === null) return;
              try { await apiPost("adjustment-update", token, { id: entry.id, status: "RESOLVED", resolution: resolution.trim() || null }); await loadDiary(); }
              catch (error) { setDiaryError(error instanceof Error ? error.message : "Não foi possível concluir o ajuste."); }
            }

            const field: React.CSSProperties = { display: "grid", gap: 6 };
            const grid: React.CSSProperties = { display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(210px,1fr))", gap: 10 };
            const wide: React.CSSProperties = { width: "100%" };

            return <div className="view-stack">
              <section className="card section">
                <div className="panel-heading"><div><span className="eyebrow">Diário</span><h2>Diário de Ajustes</h2><p className="small">{formatNumber(counts.adjustments, 0)} ajustes · {formatNumber(counts.tasks, 0)} tarefas no escopo atual</p></div></div>
                <div className="tab-row" style={{ marginTop: 12 }}><button className={tab === "ajustes" ? "active" : ""} onClick={() => setTab("ajustes")}>Diário de Ajustes</button><button className={tab === "tasklog" ? "active" : ""} onClick={() => setTab("tasklog")}>TaskLog</button></div>
                {canViewAll && <div className="tab-row" style={{ marginTop: 10 }}><button className={scope === "mine" ? "active" : ""} onClick={() => { setScope("mine"); setFilters((current: Row) => ({ ...current, author_user_id: "" })); }}>Meus registros</button><button className={scope === "all" ? "active" : ""} onClick={() => setScope("all")}>Todos os registros</button></div>}
              </section>

              {scope === "all" && canViewAll && <section className="card section"><div className="section-title">Filtros administrativos</div><div style={grid}>
                <label style={field}>Colaborador<select className="control" value={filters.author_user_id || ""} onChange={(e) => setFilters((f: Row) => ({ ...f, author_user_id: e.target.value }))}><option value="">Todos</option><option value="UNKNOWN">Autor não identificado</option>{(diary.staff || []).map((row: Row) => <option key={row.user_id} value={row.user_id}>{row.person}</option>)}</select></label>
                <label style={field}>Cliente<select className="control" value={filters.client_id || ""} onChange={(e) => setFilters((f: Row) => ({ ...f, client_id: e.target.value }))}><option value="">Todos</option>{clients.map((row: Row) => <option key={row.client_id} value={row.client_id}>{row.display_name}</option>)}</select></label>
                <label style={field}>Categoria<select className="control" value={filters.category_code || ""} onChange={(e) => setFilters((f: Row) => ({ ...f, category_code: e.target.value, subcategory_code: "" }))}><option value="">Todas</option>{categories.map((row: Row) => <option key={row.code} value={row.code}>{row.label}</option>)}</select></label>
                <label style={field}>Motivo<select className="control" value={filters.subcategory_code || ""} onChange={(e) => setFilters((f: Row) => ({ ...f, subcategory_code: e.target.value }))}><option value="">Todos</option>{filterSubs.map((row: Row) => <option key={row.code} value={row.code}>{row.label}</option>)}</select></label>
                <label style={field}>Área relacionada<select className="control" value={filters.responsible_area || ""} onChange={(e) => setFilters((f: Row) => ({ ...f, responsible_area: e.target.value }))}><option value="">Todas</option>{areas.map(([code,label]) => <option key={code} value={code}>{label}</option>)}</select></label>
                <label style={field}>Status<select className="control" value={filters.status || ""} onChange={(e) => setFilters((f: Row) => ({ ...f, status: e.target.value }))}><option value="">Todos</option>{statuses.map(([code,label]) => <option key={code} value={code}>{label}</option>)}</select></label>
                <label style={field}>De<input className="control" type="date" value={filters.since || ""} onChange={(e) => setFilters((f: Row) => ({ ...f, since: e.target.value }))}/></label>
                <label style={field}>Até<input className="control" type="date" value={filters.until || ""} onChange={(e) => setFilters((f: Row) => ({ ...f, until: e.target.value }))}/></label>
              </div><button style={{ marginTop: 10 }} onClick={() => setFilters({ author_user_id: "", client_id: "", category_code: "", subcategory_code: "", responsible_area: "", status: "", since: "", until: "" })}>Limpar filtros</button></section>}

              {diaryError && <div className="error-box">{diaryError}</div>}

              {tab === "ajustes" ? <>
                <section className="card section">
                  <div className="section-title" style={{ display: "flex", alignItems: "center", gap: 8 }}>Novo ajuste
                    <details style={{ display: "inline-block", position: "relative" }}><summary aria-label="Como usar o Diário de Ajustes" title="Como usar" style={{ cursor: "pointer", listStyle: "none", width: 22, height: 22, borderRadius: 999, display: "inline-grid", placeItems: "center", border: "1px solid var(--border)" }}>?</summary><div className="card" style={{ position: "absolute", zIndex: 20, top: 28, left: 0, width: "min(420px,80vw)", padding: 14 }}><p>Use este espaço para registrar ajustes, correções ou retrabalhos de um cliente. Informe o que precisou ser corrigido e, principalmente, por que aconteceu. Atividades normais do dia a dia pertencem ao TaskLog.</p><p className="small"><b>Correto:</b> Cliente pediu para trocar a imagem porque foi utilizado um render antigo.</p><p className="small"><b>Não usar para:</b> Hoje alterei o criativo do cliente.</p></div></details>
                  </div>
                  <div style={grid}>
                    <label style={field}>Cliente *<select className="control" required value={adjClient} onChange={(e) => setAdjClient(e.target.value)}><option value="">Selecione…</option>{clients.map((row: Row) => <option key={row.client_id} value={row.client_id}>{row.display_name}</option>)}</select></label>
                    <label style={field}>Data do ajuste *<input className="control" type="datetime-local" required value={adjOccurred} onChange={(e) => setAdjOccurred(e.target.value)}/></label>
                    <label style={field}>Categoria *<select className="control" required value={adjCategory} onChange={(e) => { setAdjCategory(e.target.value); setAdjSubcategory(""); }}><option value="">Selecione…</option>{categories.map((row: Row) => <option key={row.code} value={row.code}>{row.label}</option>)}</select></label>
                    <label style={field}>Motivo *<select className="control" required disabled={!adjCategory} value={adjSubcategory} onChange={(e) => setAdjSubcategory(e.target.value)}><option value="">Selecione…</option>{categorySubs.map((row: Row) => <option key={row.code} value={row.code}>{row.label}</option>)}</select></label>
                    <label style={field}>Origem da solicitação *<select className="control" required value={adjOrigin} onChange={(e) => setAdjOrigin(e.target.value)}><option value="">Selecione…</option>{origins.map(([code,label]) => <option key={code} value={code}>{label}</option>)}</select></label>
                  </div>
                  <label style={{ ...field, marginTop: 10 }}>O que precisou ser ajustado *<textarea className="control" style={wide} rows={3} required placeholder="Ex.: Foi necessário trocar a imagem principal do criativo." value={adjDescription} onChange={(e) => setAdjDescription(e.target.value)}/></label>
                  <label style={{ ...field, marginTop: 10 }}>Por que precisou ser ajustado *<textarea className="control" style={wide} rows={3} required placeholder="Ex.: O render utilizado era antigo e não correspondia ao material oficial." value={adjReason} onChange={(e) => setAdjReason(e.target.value)}/></label>
                  <details style={{ marginTop: 12 }}><summary style={{ cursor: "pointer" }}>Mais detalhes</summary><div style={{ ...grid, marginTop: 10 }}>
                    <label style={field}>Área relacionada<select className="control" value={adjArea} onChange={(e) => setAdjArea(e.target.value)}><option value="">Não informado</option>{areas.map(([code,label]) => <option key={code} value={code}>{label}</option>)}</select></label>
                    <label style={field}>Gravidade<select className="control" value={adjSeverity} onChange={(e) => setAdjSeverity(e.target.value)}><option value="">Não informada</option>{severity.map(([code,label]) => <option key={code} value={code}>{label}</option>)}</select></label>
                    <label style={field}>Status<select className="control" value={adjStatus} onChange={(e) => setAdjStatus(e.target.value)}>{statuses.map(([code,label]) => <option key={code} value={code}>{label}</option>)}</select></label>
                    <label style={{ ...field, alignContent: "end" }}><span><input type="checkbox" checked={adjRecurrent} onChange={(e) => setAdjRecurrent(e.target.checked)}/> Problema reincidente</span></label>
                  </div>{adjStatus === "RESOLVED" && <label style={{ ...field, marginTop: 10 }}>Solução<textarea className="control" rows={2} value={adjResolution} onChange={(e) => setAdjResolution(e.target.value)} placeholder="Como o problema foi resolvido?"/></label>}</details>
                  {adjError && <div className="error-box" style={{ marginTop: 8 }}>{adjError}</div>}
                  <button type="button" className="primary" style={{ marginTop: 10 }} disabled={adjSaving} onClick={submitAdjustment}>{adjSaving ? "Salvando…" : "Registrar ajuste"}</button>
                </section>
                <section className="card section"><div className="section-title">{scope === "all" ? "Todos os registros" : "Meus registros"}</div>{loadingDiary ? <div className="empty">Carregando registros…</div> : adjustments.length ? adjustments.map((entry: Row) => <div className="productivity-row" key={entry.id}><div><b>{entry.client_display_name || "Cliente não identificado"}</b><small>{entry.category_label || entry.category_code || entry.tipo || "Sem categoria"}{entry.subcategory_label ? ` · ${entry.subcategory_label}` : ""}</small><p>{entry.description || entry.descricao}</p>{entry.reason && <p className="small"><b>Por quê:</b> {entry.reason}</p>}<small>Registrado por {entry.author_name || entry.author_name_snapshot || "Autor não identificado"} · Ajuste em {formatDate(entry.occurred_at)}{entry.created_at ? ` · Registrado em ${formatDate(entry.created_at)}` : " · Registro legado sem created_at"}</small><small>{originLabel(entry.request_origin)}{entry.responsible_area ? ` · Área: ${areaLabel(entry.responsible_area)}` : ""} · {statusLabel(entry.status)}{entry.severity ? ` · ${text(entry.severity)}` : ""}</small>{entry.resolution && <p className="small"><b>Solução:</b> {entry.resolution}</p>}</div>{!["RESOLVED","DISCARDED","LEGACY_UNKNOWN"].includes(String(entry.status)) && <button onClick={() => resolveAdjustment(entry)}>Marcar resolvido</button>}</div>) : <div className="empty">Nenhum ajuste neste escopo.</div>}</section>
              </> : <>
                <section className="card section"><div className="section-title">TaskLog</div><p className="small">Use para registrar atividades normais executadas. Ajustes, correções e retrabalho pertencem ao Diário de Ajustes.</p><div style={grid}><label style={field}>Categoria *<input className="control" value={taskCategory} onChange={(e) => setTaskCategory(e.target.value)} placeholder="Ex.: Criativo, campanha, reunião"/></label><label style={field}>Data *<input className="control" type="date" value={taskDate} onChange={(e) => setTaskDate(e.target.value)}/></label></div><label style={{ ...field, marginTop: 10 }}>Atividade executada *<textarea className="control" rows={3} value={taskName} onChange={(e) => setTaskName(e.target.value)} placeholder="Ex.: Publiquei a campanha do cliente."/></label>{taskError && <div className="error-box" style={{ marginTop: 8 }}>{taskError}</div>}<button className="primary" style={{ marginTop: 10 }} disabled={taskSaving} onClick={submitTask}>{taskSaving ? "Salvando…" : "Registrar no TaskLog"}</button></section>
                <section className="card section"><div className="section-title">{scope === "all" ? "TaskLog da equipe" : "Meu TaskLog"}</div>{loadingDiary ? <div className="empty">Carregando registros…</div> : tasks.length ? tasks.map((entry: Row) => <div className="productivity-row" key={entry.id}><div><b>{entry.task_name}</b><small>{entry.category} · {entry.collaborator_name || "Autor não identificado"} · {formatDay(entry.task_date)}</small></div></div>) : <div className="empty">Nenhuma atividade neste escopo.</div>}</section>
              </>}
            </div>;
          }'''
          pattern = re.compile(r'function DiaryCenter\([\s\S]*?\n\}\n\n\nfunction ClickUpCenter')
          match = pattern.search(text)
          if match:
              text = text[:match.start()] + component + '\n\n\nfunction ClickUpCenter' + text[match.end():]
              page.write_text(text)
          elif 'const [scope, setScope] = useState<"mine" | "all">("mine")' not in text:
              raise SystemExit('DiaryCenter anchor not found')
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated diary patch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- app/page.tsx app/shared.tsx; then exit 0; fi
          git config user.name "chatgpt-automation"
          git config user.email "chatgpt-automation@users.noreply.github.com"
          git add app/page.tsx app/shared.tsx
          git commit -m "Implement isolated structured adjustment diary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: ImobiBoard iOS Compile

on:
  push:
    branches:
      - feat/mobile-app
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/imobiboard-ios-compile.yml"
  workflow_dispatch:

jobs:
  ios-compile:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build web app
        run: pnpm --filter @imobi-board/web build

      - name: Sync Capacitor iOS
        working-directory: apps/web
        run: pnpm exec cap sync ios

      - name: Compile iOS Simulator target
        working-directory: apps/web
        run: >
          xcodebuild -project ios/App/App.xcodeproj
          -scheme App -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

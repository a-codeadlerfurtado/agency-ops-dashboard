name: Probe Cloudflare deployment environment

on:
  push:
    branches:
      - briefing-hub-drive-deploy-20260901
    paths:
      - '.github/workflows/briefing-hub-drive-inspect.yml'

permissions:
  contents: read

jobs:
  probe-environment:
    strategy:
      fail-fast: false
      matrix:
        env_name: [production, Production, cloudflare, Cloudflare, workers, Workers, deploy, Deploy]
    environment: ${{ matrix.env_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || 'c3e4211c99f0c7d71701a6f59a23befb' }}
    steps:
      - name: Probe environment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "ENVIRONMENT=${{ matrix.env_name }} CF_TOKEN_PRESENT=false"
            exit 0
          fi
          echo "ENVIRONMENT=${{ matrix.env_name }} CF_TOKEN_PRESENT=true"
          HTTP=$(curl -sS -o /tmp/cf.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/agency-briefing-hub/deployments" \
            -H "Authorization: Bearer $CF_API_TOKEN")
          echo "ENVIRONMENT=${{ matrix.env_name }} CLOUDFLARE_HTTP=$HTTP"
          if [ "$HTTP" = "200" ] && jq -e '.success == true' /tmp/cf.json >/dev/null 2>&1; then
            echo "ENVIRONMENT=${{ matrix.env_name }} CLOUDFLARE_ACCESS_OK=true"
          else
            echo "ENVIRONMENT=${{ matrix.env_name }} CLOUDFLARE_ACCESS_OK=false"
          fi

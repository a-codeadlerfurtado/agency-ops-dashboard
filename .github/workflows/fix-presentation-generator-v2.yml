name: Patch presentation generator assertion

on:
  push:
    branches:
      - briefing-hub-presentation-20260902
    paths:
      - '.github/workflows/fix-presentation-generator-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: briefing-hub-presentation-20260902
      - name: Patch assertion and trigger generator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/build-briefing-hub-presentation.yml')
          s=p.read_text()
          s2,n=re.subn(r"grep -q '[^\n]*bh-shell[^\n]*' /tmp/briefing-live\.html", "grep -q 'bh-shell' /tmp/briefing-live.html", s, count=1)
          if n != 1:
              raise SystemExit(f'assertion replacements={n}')
          p.write_text(s2)
          PY
          git config user.name 'briefing-hub-presentation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/build-briefing-hub-presentation.yml
          git commit -m 'fix: accept generated bh-shell source marker'
          git push origin HEAD:briefing-hub-presentation-20260902

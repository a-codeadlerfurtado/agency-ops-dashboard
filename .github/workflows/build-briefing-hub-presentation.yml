name: Build Briefing Hub presentation mode

on:
  push:
    branches:
      - briefing-hub-presentation-20260902
    paths:
      - '.github/workflows/build-briefing-hub-presentation.yml'
      - 'app/briefing-hub-demo/**'
      - 'app/briefing-hub-demo.html/**'

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: briefing-hub-presentation-20260902
          fetch-depth: 0
      - name: Load exact live Briefing Hub client frontend
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin briefing-hub-drive-deploy-20260901:refs/remotes/origin/briefing-hub-drive-deploy-20260901
          git show origin/briefing-hub-drive-deploy-20260901:.briefing-live/cliente.html > /tmp/briefing-live.html
          test -s /tmp/briefing-live.html
          grep -q 'class="bh-shell"' /tmp/briefing-live.html
      - name: Generate isolated presentation route from live frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          html = Path('/tmp/briefing-live.html').read_text(encoding='utf-8')
          html = html.replace('<title>Briefing Hub</title>', '<title>Briefing Hub · Modo apresentação</title>', 1)

          demo = r'''<style>
          .bh-demo-badge{margin:0 0 10px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:9px;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.11em;text-align:center;text-transform:uppercase}
          .bh-demo-toast{position:fixed;right:18px;bottom:18px;z-index:9999;max-width:360px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-size:11px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.bh-demo-toast.show{opacity:1;transform:none}
          </style><script>
          (()=>{
            const NOW='2026-09-02T14:30:00.000Z';
            const mkProgress=(percent,done,total,section,submitted=null,updated=NOW)=>({percent,done,total,current_section:section,fill_mode:'QUICK',current_step:0,current_question_key:null,submitted_at:submitted,updated_at:updated});
            const overview={
              products:[
                {id:'prod_aurora',name:'Residencial Aurora',status:'IN_PROGRESS',updated_at:'2026-09-02T14:28:00.000Z',personas:[{id:'persona_upgrade',name:'Casal em fase de upgrade'}],progress:mkProgress(62,8,13,'Estratégia')},
                {id:'prod_vista',name:'Vista Parque Residence',status:'COMPLETE',updated_at:'2026-08-29T17:10:00.000Z',personas:[{id:'persona_invest',name:'Investidor patrimonial'}],progress:mkProgress(100,12,12,'Complemento','2026-08-29T17:10:00.000Z','2026-08-29T17:10:00.000Z')}
              ],
              personas:[
                {id:'persona_upgrade',name:'Casal em fase de upgrade',status:'COMPLETE',intent:'Moradia',product_count:1,updated_at:'2026-08-30T13:00:00.000Z',progress:mkProgress(100,10,10,'Decisão','2026-08-30T13:00:00.000Z','2026-08-30T13:00:00.000Z')},
                {id:'persona_invest',name:'Investidor patrimonial',status:'IN_PROGRESS',intent:'Investimento',product_count:1,updated_at:'2026-08-28T12:00:00.000Z',progress:mkProgress(45,5,11,'Perfil',null,'2026-08-28T12:00:00.000Z')}
              ]
            };
            const productQuestions=[
              {question_key:'product.type',section_name:'Sobre o produto',position:1,label:'Que tipo de produto é este?',input_type:'SELECT',options:['Apartamento','Casa','Lote','Comercial'],required:true,help_what:'Defina o tipo principal do imóvel que será anunciado.',help_why:'Isso organiza o restante do briefing.',example_text:'Apartamento residencial.'},
              {question_key:'product.location',section_name:'Localização',position:1,label:'Onde fica o produto?',input_type:'TEXT',required:true,help_what:'Informe bairro, cidade e estado.',help_why:'Localização muda público, mídia e mensagem.',example_text:'Jardim Aquarius · São José dos Campos/SP.'},
              {question_key:'product.price',section_name:'Características',position:1,label:'Qual é a faixa de preço?',input_type:'TEXT',required:true,help_what:'Use o preço ou faixa comercial válida hoje.',help_why:'Ajuda a calibrar público e comunicação.'},
              {question_key:'product.configuration',section_name:'Características',position:2,label:'Como é a configuração?',input_type:'TEXTAREA',required:true,help_what:'Quartos, suítes, vagas, metragem e pontos objetivos.'},
              {question_key:'product.differentials',section_name:'Características',position:3,label:'Quais são os principais diferenciais?',input_type:'TEXTAREA',required:true,allow_unknown:true,help_what:'O que faz este produto ser escolhido em vez de alternativas parecidas?',help_why:'Isso vira matéria-prima para estratégia e criativos.'},
              {question_key:'product.availability',section_name:'Disponibilidade',position:1,label:'O produto está disponível para venda agora?',input_type:'BOOLEAN',required:true},
              {question_key:'product.buy_reason',section_name:'Estratégia',position:1,label:'Por que alguém compraria este produto?',input_type:'TEXTAREA',required:true,allow_unknown:true,help_what:'Pense no ganho prático, emocional ou patrimonial.'},
              {question_key:'product.special_offer',section_name:'Oferta e condições',position:1,label:'Existe alguma condição comercial ativa?',input_type:'TEXTAREA',required:false,help_what:'Registre somente condições realmente válidas.'},
              {question_key:'product.notes',section_name:'Complemento',position:1,label:'Algo importante ficou de fora?',input_type:'TEXTAREA',required:false}
            ];
            const personaQuestions=[
              {question_key:'persona.intent',section_name:'Quem compra',position:1,label:'Qual é a principal intenção deste público?',input_type:'SELECT',options:['Moradia','Investimento','Segunda moradia'],required:true},
              {question_key:'persona.age_range',section_name:'Perfil',position:1,label:'Qual faixa etária faz mais sentido?',input_type:'TEXT',required:true},
              {question_key:'persona.income_range',section_name:'Perfil',position:2,label:'Qual faixa de renda familiar?',input_type:'TEXT',required:true},
              {question_key:'persona.location',section_name:'De onde vem',position:1,label:'De quais regiões esse público costuma vir?',input_type:'TEXTAREA',required:true},
              {question_key:'persona.desires',section_name:'Decisão',position:1,label:'O que essa pessoa mais deseja?',input_type:'TEXTAREA',required:true,allow_unknown:true},
              {question_key:'persona.objections',section_name:'Decisão',position:2,label:'O que costuma travar a decisão?',input_type:'TEXTAREA',required:true,allow_unknown:true},
              {question_key:'persona.notes',section_name:'Complemento',position:1,label:'Há algum detalhe adicional relevante?',input_type:'TEXTAREA',required:false}
            ];
            const entities={
              'PRODUCT:prod_aurora':{entity:{id:'prod_aurora',name:'Residencial Aurora',status:'IN_PROGRESS'},questions:productQuestions,answers:{
                'product.type':{value:'Apartamento'},'product.location':{value:'Jardim Aquarius · São José dos Campos/SP'},'product.price':{value:'A partir de R$ 890.000,00'},'product.configuration':{value:'92 a 118 m² · 3 dormitórios · 1 suíte · 2 vagas'},'product.differentials':{value:'Varanda gourmet, lazer completo e localização consolidada.'},'product.availability':{value:'Sim'},'product.buy_reason':{value:''},'product.special_offer':{value:''},'product.notes':{value:''}},links:[{id:'persona_upgrade',name:'Casal em fase de upgrade',status:'COMPLETE'}]},
              'PRODUCT:prod_vista':{entity:{id:'prod_vista',name:'Vista Parque Residence',status:'COMPLETE'},questions:productQuestions,answers:{
                'product.type':{value:'Apartamento'},'product.location':{value:'Vila Ema · São José dos Campos/SP'},'product.price':{value:'R$ 1.290.000,00'},'product.configuration':{value:'108 m² · 3 dormitórios · 1 suíte · 2 vagas'},'product.differentials':{value:'Planta funcional, varanda gourmet e condomínio completo.'},'product.availability':{value:'Sim'},'product.buy_reason':{value:'Upgrade de moradia com localização central e patrimônio sólido.'},'product.special_offer':{value:'Condição sob consulta com a equipe comercial.'},'product.notes':{value:'Priorizar comunicação sofisticada e objetiva.'}},links:[{id:'persona_invest',name:'Investidor patrimonial',status:'IN_PROGRESS'}]},
              'PERSONA:persona_upgrade':{entity:{id:'persona_upgrade',name:'Casal em fase de upgrade',status:'COMPLETE'},questions:personaQuestions,answers:{
                'persona.intent':{value:'Moradia'},'persona.age_range':{value:'30 a 45 anos'},'persona.income_range':{value:'Acima de R$ 18 mil/mês'},'persona.location':{value:'São José dos Campos e cidades próximas'},'persona.desires':{value:'Mais espaço, segurança, boa localização e valorização patrimonial.'},'persona.objections':{value:'Entrada alta, financiamento e comparação com imóveis usados maiores.'},'persona.notes':{value:'Normalmente já mora em imóvel menor e está em fase de upgrade.'}},links:[]},
              'PERSONA:persona_invest':{entity:{id:'persona_invest',name:'Investidor patrimonial',status:'IN_PROGRESS'},questions:personaQuestions,answers:{
                'persona.intent':{value:'Investimento'},'persona.age_range':{value:'35 a 55 anos'},'persona.income_range':{value:'Acima de R$ 25 mil/mês'},'persona.location':{value:'Vale do Paraíba e Grande São Paulo'},'persona.desires':{value:'Valorização patrimonial e liquidez.'},'persona.objections':{value:''},'persona.notes':{value:''}},links:[]}
            };
            const progress={
              'PRODUCT:prod_aurora':{progress:overview.products[0].progress,stats:{done:8,total:13,percent:62},flags:[]},
              'PRODUCT:prod_vista':{progress:overview.products[1].progress,stats:{done:12,total:12,percent:100},flags:[]},
              'PERSONA:persona_upgrade':{progress:overview.personas[0].progress,stats:{done:10,total:10,percent:100},flags:[]},
              'PERSONA:persona_invest':{progress:overview.personas[1].progress,stats:{done:5,total:11,percent:45},flags:[]}
            };
            const histories={
              'PRODUCT:prod_aurora':[
                {question_key:'product.differentials',label:'Principais diferenciais',old_value:'Lazer completo',new_value:'Varanda gourmet, lazer completo e localização consolidada.',changed_at:'2026-09-02T13:42:00.000Z',changed_by_name:'Mariana Costa'},
                {question_key:'product.price',label:'Faixa de preço',old_value:'A partir de R$ 850.000,00',new_value:'A partir de R$ 890.000,00',changed_at:'2026-09-01T18:16:00.000Z',changed_by_name:'Mariana Costa'}
              ],
              'PRODUCT:prod_vista':[{question_key:'product.special_offer',label:'Condição comercial',old_value:'',new_value:'Condição sob consulta com a equipe comercial.',changed_at:'2026-08-29T17:08:00.000Z',changed_by_name:'Mariana Costa'}],
              'PERSONA:persona_upgrade':[{question_key:'persona.objections',label:'Objeções',old_value:'Preço',new_value:'Entrada alta, financiamento e comparação com imóveis usados maiores.',changed_at:'2026-08-30T12:55:00.000Z',changed_by_name:'Mariana Costa'}],
              'PERSONA:persona_invest':[{question_key:'persona.desires',label:'Desejos',old_value:'Valorização',new_value:'Valorização patrimonial e liquidez.',changed_at:'2026-08-28T11:48:00.000Z',changed_by_name:'Mariana Costa'}]
            };
            const account={client:{id:'demo-client',name:'Imobiliária Horizonte'},questions:[
              {question_key:'brand.positioning',section_name:'Marca',position:1,label:'Como você define o posicionamento da sua marca?',input_type:'TEXTAREA',required:false,help_what:'Explique em poucas palavras como quer ser percebido.'},
              {question_key:'brand.region',section_name:'Mercado',position:1,label:'Qual é sua principal região de atuação?',input_type:'TEXT',required:false}
            ],answers:{'brand.positioning':{value:'Atendimento consultivo para imóveis de médio e alto padrão.'},'brand.region':{value:'São José dos Campos e Vale do Paraíba'}}};
            const materials={ready:true,folder_name:'Materiais Brutos · Imobiliária Horizonte',folder_url:'#presentation-drive',files:[
              {file_name:'Logo oficial.svg',path:'Identidade visual',size_bytes:248320,modified_at:'2026-09-01T16:10:00.000Z',web_url:'#presentation-file'},
              {file_name:'Fachada - Residencial Aurora.jpg',path:'Fotos / Residencial Aurora',size_bytes:4823440,modified_at:'2026-09-01T15:54:00.000Z',web_url:'#presentation-file'},
              {file_name:'Vídeo decorado.mp4',path:'Vídeos / Residencial Aurora',size_bytes:38742112,modified_at:'2026-08-31T19:20:00.000Z',web_url:'#presentation-file'},
              {file_name:'Apresentação comercial.pdf',path:'Materiais comerciais',size_bytes:7341056,modified_at:'2026-08-30T12:14:00.000Z',web_url:'#presentation-file'}
            ]};
            const portal={config:{has_crm:true,crm_name:'Kommo',crm_url:'https://exemplo.invalid/crm',crm_login:'comercial@horizonte.com.br',crm_password_saved:true,lead_phone:''}};
            const user={display_name:'Mariana Costa',username:'mariana.horizonte',client_name:'Imobiliária Horizonte',must_change_password:false};
            const clone=x=>JSON.parse(JSON.stringify(x));
            const keyFor=(type,id)=>String(type||'').toUpperCase()+':'+String(id||'');
            const jsonResponse=(data,status=200)=>new Response(JSON.stringify(data),{status,headers:{'content-type':'application/json; charset=utf-8','cache-control':'no-store'}});
            const toast=(msg)=>{let t=document.querySelector('.bh-demo-toast');if(!t){t=document.createElement('div');t.className='bh-demo-toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2600)};
            const ensureBadge=()=>{let foot=document.querySelector('.bh-side-footer');if(foot&&!document.querySelector('.bh-demo-badge')){let b=document.createElement('div');b.className='bh-demo-badge';b.textContent='Modo apresentação';foot.prepend(b)}};
            new MutationObserver(ensureBadge).observe(document.documentElement,{childList:true,subtree:true});
            document.addEventListener('click',e=>{let out=e.target.closest?.('#out');if(out){e.preventDefault();e.stopImmediatePropagation();toast('Modo apresentação: nenhum acesso real será encerrado.');return}let a=e.target.closest?.('a');if(a){let h=a.getAttribute('href')||'';if(h.startsWith('#presentation')||h.startsWith('/api/client/pdf')||h.startsWith('/api/client/file')){e.preventDefault();e.stopImmediatePropagation();toast(h.includes('drive')?'Modo apresentação: esta seria a pasta oficial do cliente no Google Drive.':'Modo apresentação: arquivo demonstrativo, sem download real.')}}},true);
            document.addEventListener('change',e=>{if(e.target?.id==='mfile'){e.preventDefault();e.stopImmediatePropagation();e.target.value='';toast('Modo apresentação: uploads são simulados e nada é enviado ao Drive.')}},true);
            const nativeFetch=window.fetch.bind(window);
            window.fetch=async(input,init={})=>{
              const raw=typeof input==='string'?input:input?.url||'';
              const u=new URL(raw,location.href), path=u.pathname, method=String(init.method||'GET').toUpperCase();
              if(!path.startsWith('/api/client/')) return nativeFetch(input,init);
              let body={}; try{body=init.body?JSON.parse(init.body):{}}catch{}
              if(path==='/api/client/me') return jsonResponse({user:clone(user)});
              if(path==='/api/client/overview') return jsonResponse(clone(overview));
              if(path==='/api/client/account'){
                if(method==='GET') return jsonResponse(clone(account));
                if(body.key){account.answers[body.key]={value:body.value};toast('Alteração simulada — nada foi salvo fora desta apresentação.')} return jsonResponse({ok:true});
              }
              if(path==='/api/client/entity'){
                const k=keyFor(u.searchParams.get('type'),u.searchParams.get('id'));
                return jsonResponse(clone(entities[k]||entities['PRODUCT:prod_aurora']));
              }
              if(path==='/api/client/progress'){
                const k=keyFor(u.searchParams.get('type')||body.type,u.searchParams.get('id')||body.id);
                if(method==='PUT'){let p=progress[k]||(progress[k]={progress:mkProgress(0,0,9,'Sobre o produto'),stats:{done:0,total:9,percent:0},flags:[]});Object.assign(p.progress,body);return jsonResponse({ok:true,progress:clone(p.progress)});} return jsonResponse(clone(progress[k]||progress['PRODUCT:prod_aurora']));
              }
              if(path==='/api/client/files') return jsonResponse({files:[]});
              if(path==='/api/client/history'){
                const k=keyFor(u.searchParams.get('type'),u.searchParams.get('id'));return jsonResponse({history:clone(histories[k]||[])});
              }
              if(path==='/api/client/materials') return jsonResponse(clone(materials));
              if(path==='/api/client/portal-config'){
                if(method==='PUT'){Object.assign(portal.config,body);portal.config.crm_password_saved=portal.config.crm_password_saved||!!body.crm_password;toast('Integração simulada — nenhuma credencial real foi alterada.');return jsonResponse(clone(portal));} return jsonResponse(clone(portal));
              }
              if(path==='/api/client/answer'&&method==='PUT'){
                const k=keyFor(body.type,body.id);if(entities[k]) entities[k].answers[body.key]={value:body.value};return jsonResponse({ok:true,status:'DRAFT'});
              }
              if(path==='/api/client/submit'&&method==='POST'){
                const k=keyFor(body.type,body.id),sent=new Date().toISOString();if(progress[k]) progress[k].progress.submitted_at=sent;toast('Envio simulado — nenhum briefing real foi enviado.');return jsonResponse({ok:true,submitted_at:sent});
              }
              if(path.includes('validate')||path.includes('review')) return jsonResponse({ok:true,missing:[],review_flags:[],flags:[]});
              if(path==='/api/client/products'&&method==='POST'){
                const id='demo-product-'+Date.now();overview.products.unshift({id,name:String(body.name||'Novo produto demonstrativo'),status:'IN_PROGRESS',updated_at:new Date().toISOString(),personas:[],progress:mkProgress(0,0,9,'Sobre o produto')});entities['PRODUCT:'+id]={entity:{id,name:String(body.name||'Novo produto demonstrativo'),status:'IN_PROGRESS'},questions:productQuestions,answers:{},links:[]};progress['PRODUCT:'+id]={progress:overview.products[0].progress,stats:{done:0,total:9,percent:0},flags:[]};histories['PRODUCT:'+id]=[];toast('Produto criado apenas nesta apresentação.');return jsonResponse({id});
              }
              if(path==='/api/client/personas'&&method==='POST'){
                const id='demo-persona-'+Date.now();overview.personas.unshift({id,name:String(body.name||'Nova persona demonstrativa'),status:'IN_PROGRESS',intent:'',product_count:0,updated_at:new Date().toISOString(),progress:mkProgress(0,0,7,'Quem compra')});entities['PERSONA:'+id]={entity:{id,name:String(body.name||'Nova persona demonstrativa'),status:'IN_PROGRESS'},questions:personaQuestions,answers:{},links:[]};progress['PERSONA:'+id]={progress:overview.personas[0].progress,stats:{done:0,total:7,percent:0},flags:[]};histories['PERSONA:'+id]=[];toast('Persona criada apenas nesta apresentação.');return jsonResponse({id});
              }
              if(path==='/api/client/duplicate-persona'&&method==='POST'){
                const src=entities['PERSONA:'+body.persona_id]||entities['PERSONA:persona_upgrade'],id='demo-persona-copy-'+Date.now(),name=String(body.name||'Persona — variação');entities['PERSONA:'+id]={...clone(src),entity:{id,name,status:'IN_PROGRESS'}};overview.personas.unshift({id,name,status:'IN_PROGRESS',intent:'',product_count:0,updated_at:new Date().toISOString(),progress:mkProgress(0,0,7,'Quem compra')});progress['PERSONA:'+id]={progress:overview.personas[0].progress,stats:{done:0,total:7,percent:0},flags:[]};histories['PERSONA:'+id]=[];toast('Cópia criada apenas nesta apresentação.');return jsonResponse({id});
              }
              if(path==='/api/client/materials/upload-start') return jsonResponse({upload_id:'presentation-upload'});
              if(path==='/api/client/requests') return jsonResponse({requests:[]});
              if(path==='/api/client/approvals') return jsonResponse({approvals:[]});
              if(method!=='GET') {toast('Ação simulada — nenhuma informação real foi alterada.');return jsonResponse({ok:true,status:'DRAFT',id:'demo-'+Date.now()});}
              return jsonResponse({ok:true});
            };
          })();
          </script>'''

          marker = '<script>\n  const M = window.MODE,'
          if marker not in html:
              marker = '<script>\nconst M = window.MODE,'
          if marker not in html:
              raise SystemExit('Could not locate live client bootstrap marker')
          html = html.replace(marker, demo + marker, 1)

          route = '''export const runtime = "edge";\n\nconst HTML = %s;\n\nexport async function GET() {\n  return new Response(HTML, {\n    status: 200,\n    headers: {\n      "content-type": "text/html; charset=utf-8",\n      "cache-control": "no-store, max-age=0",\n      "x-robots-tag": "noindex, nofollow",\n    },\n  });\n}\n''' % json.dumps(html, ensure_ascii=False)
          Path('app/briefing-hub-demo').mkdir(parents=True, exist_ok=True)
          Path('app/briefing-hub-demo/route.ts').write_text(route, encoding='utf-8')

          redirect = '''export const runtime = "edge";\n\nexport async function GET(request: Request) {\n  const target = new URL("/briefing-hub-demo", request.url);\n  return Response.redirect(target, 307);\n}\n'''
          Path('app/briefing-hub-demo.html').mkdir(parents=True, exist_ok=True)
          Path('app/briefing-hub-demo.html/route.ts').write_text(redirect, encoding='utf-8')
          PY
      - name: Validate generated routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bh-shell' app/briefing-hub-demo/route.ts
          grep -q 'Modo apresentação' app/briefing-hub-demo/route.ts
          grep -q 'Residencial Aurora' app/briefing-hub-demo/route.ts
          npm ci
          npm run typecheck
          npm run build
      - name: Commit generated presentation routes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'briefing-hub-presentation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/briefing-hub-demo/route.ts app/briefing-hub-demo.html/route.ts
          if git diff --cached --quiet; then
            echo 'Generated routes unchanged'
          else
            git commit -m 'feat: add exact Briefing Hub presentation mode'
            git push origin HEAD:briefing-hub-presentation-20260902
          fi

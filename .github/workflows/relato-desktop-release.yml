name: Relato Desktop Release

on:
  push:
    branches:
      - "relato-release-*"
    paths:
      - "desktop-agent/RelatoAI.DesktopAgent/**"
      - ".github/workflows/relato-desktop-release.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish single-file executable
        shell: pwsh
        run: |
          dotnet publish desktop-agent/RelatoAI.DesktopAgent/RelatoAI.DesktopAgent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish
          Copy-Item publish/RelatoAI.DesktopAgent.exe publish/RelatoAI-Desktop-SDR.exe
          (Get-FileHash publish/RelatoAI-Desktop-SDR.exe -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii publish/RelatoAI-Desktop-SDR.exe.sha256

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "relato-package-v2026.10.02.2"
          gh release delete $tag --yes 2>$null
          git push origin ":refs/tags/$tag" 2>$null
          gh release create $tag `
            publish/RelatoAI-Desktop-SDR.exe `
            publish/RelatoAI-Desktop-SDR.exe.sha256 `
            --target "${{ github.sha }}" `
            --title "Relato AI Desktop 0.5.11" `
            --notes "Calls longas: mantém timeout/retry resiliente da 0.5.10 e adiciona recuperação automática dos WAVs preservados no TEMP quando um upload falhar, com novo signed URL e reenvio no próximo start. Também corrige a versão registrada por call."
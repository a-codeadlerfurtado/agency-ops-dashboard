name: ChatGPT consolidate dashboard

on:
  push:
    branches:
      - chatgpt/consolidate-dashboard-20260821
    paths:
      - .github/workflows/chatgpt-consolidate.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/consolidate-dashboard-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate source-controlled fixes
        run: python .github/scripts/consolidate.py
      - name: Validate source
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit consolidated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app server supabase
          git commit -m "Consolidate dashboard profile permissions and creative hub"
          git push origin HEAD:chatgpt/consolidate-dashboard-20260821
# trigger-2

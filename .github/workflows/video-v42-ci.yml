name: Video V4.2 CI

on:
  push:
    branches:
      - feat/video-engine-v4
    paths:
      - 'vps/video-worker-v4/**'
      - '.github/workflows/video-v42-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VIDEO_WORK_DIR: /tmp/video-v42-work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: |
          python -m py_compile vps/video-worker-v4/worker.py
          python -m py_compile vps/video-worker-v4/director_v42.py
          python -m py_compile vps/video-worker-v4/worker_v42.py
          python -m py_compile vps/video-worker-v4/worker_v421.py
          python -m py_compile vps/video-worker-v4/demo_v42_local.py
          python -m py_compile vps/video-worker-v4/smoke_raw.py
      - name: Validate creative director contract
        working-directory: vps/video-worker-v4
        run: |
          python - <<'PY'
          import os
          os.makedirs('/tmp/video-v42-work', exist_ok=True)
          import worker as w
          import worker_v421
          import director_v42 as d
          inputs = [
              {'id': 'i1', 'asset_id': 'a1', 'drive_file_id': 'd1', 'file_name': 'one.mp4'},
              {'id': 'i2', 'asset_id': 'a2', 'drive_file_id': 'd2', 'file_name': 'two.mp4'},
              {'id': 'i3', 'asset_id': 'a3', 'drive_file_id': 'd3', 'file_name': 'three.mp4'},
          ]
          analyses = []
          for i in range(3):
              analyses.append({
                  'duration_seconds': 20.0,
                  'width': 1080,
                  'height': 1920,
                  'fps': 30.0,
                  'video_codec': 'h264',
                  'audio_codec': 'aac',
                  'has_audio': True,
                  'size_bytes': 1_000_000,
                  'cut_timestamps': [],
                  'black_ranges': [],
              })
          job = {
              'id': 'ci-job',
              'client_id': 'ci-client',
              'product_id': 'ci-product',
              'product_name': 'Apartamento Jardins',
              'product_context': {'target_duration_seconds': 18, 'area': '184 m²', 'price': 'R$ 2.900.000'},
              'client_context': {'client': {'name': 'Cliente CI'}, 'fields': {}},
              'edit_strategy': {'target_duration_seconds': 18},
          }
          timeline = w.build_timeline(job, inputs, analyses)
          qa = d.validate_creative_timeline(timeline)
          videos = next(t['items'] for t in timeline['tracks'] if t['kind'] == 'video')
          assert qa['pass'] is True
          assert qa['visible_transitions'] == 0
          assert qa['speed_ramps'] <= 2
          assert len(videos) >= 8
          assert timeline['directorVersion'] == 'creative-director-v4.2.1'
          by_asset = {}
          for v in videos:
              by_asset.setdefault(v['assetId'], []).append(float(v['trimIn']))
          repeated = [starts for starts in by_asset.values() if len(starts) > 1]
          assert repeated, 'expected repeated assets in 18s/3-source test'
          assert all(max(starts) - min(starts) > 1.0 for starts in repeated), by_asset
          assert all(v.get('transitionIn') is None or v['transitionIn'].get('kind') == 'cut' for v in videos)
          print('V421_CONTRACT_OK', qa, by_asset)
          PY

name: Apply work center operational dispatch v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-work-center-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch WorkCenter and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/dashboard-native.tsx')
          source = path.read_text()
          new_function = r'''function WorkCenter({ token, clients, profile, focusId, clearFocus }: { token: string; clients: Row[]; profile: Row; focusId: string | null; clearFocus: () => void }) {
            const [payload, setPayload] = useState<Row>({ items: [], summary: {}, roster: [] });
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState("");
            const [filter, setFilter] = useState("OPEN");
            const [personFilter, setPersonFilter] = useState("ALL");
            const [quickFilter, setQuickFilter] = useState("ALL");
            const [workQuery, setWorkQuery] = useState("");
            const [expanded, setExpanded] = useState<string | null>(focusId);
            const [resolution, setResolution] = useState<Record<string, string>>({});
            const [waitingReason, setWaitingReason] = useState<Record<string, string>>({});
            const [busy, setBusy] = useState("");
            const [formOpen, setFormOpen] = useState(false);
            const [form, setForm] = useState<Row>({ client_id: "", type: "GENERAL", priority: "MEDIUM", target_role: "CS", target_person: "Joel Antoniete", title: "", description: "", due_at: "" });

            const loadWork = useCallback(async () => {
              setLoading(true); setError("");
              try { setPayload(await api("work", token)); }
              catch (caught) { setError(caught instanceof Error ? caught.message : "Falha ao carregar demandas."); }
              finally { setLoading(false); }
            }, [token]);

            useEffect(() => { loadWork(); }, [loadWork]);
            useEffect(() => {
              if (!focusId) return;
              setExpanded(focusId); setFilter("ALL");
              window.setTimeout(() => document.getElementById(`work-${focusId}`)?.scrollIntoView({ behavior: "smooth", block: "center" }), 120);
              clearFocus();
            }, [focusId, clearFocus]);

            const nowMs = Date.now();
            const HOUR = 3600000;
            const dayKey = (value: unknown) => {
              if (!value) return "";
              const date = value instanceof Date ? value : new Date(String(value));
              if (Number.isNaN(date.getTime())) return "";
              return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
            };
            const todayKey = dayKey(new Date());
            const openItem = (item: Row) => !["COMPLETED", "DISMISSED"].includes(String(item.status));
            const ageHours = (item: Row) => item.created_at ? Math.max(0, (nowMs - new Date(String(item.created_at)).getTime()) / HOUR) : 0;
            const dueHours = (item: Row) => item.due_at ? (new Date(String(item.due_at)).getTime() - nowMs) / HOUR : null;
            const isOverdue = (item: Row) => openItem(item) && dueHours(item) != null && Number(dueHours(item)) < 0;
            const isDueToday = (item: Row) => openItem(item) && Boolean(item.due_at) && dayKey(item.due_at) === todayKey;
            const priorityWeight: Record<string, number> = { CRITICAL: 500, HIGH: 330, MEDIUM: 180, LOW: 80 };
            const operationalScore = (item: Row) => {
              let score = priorityWeight[String(item.priority)] ?? 100;
              const due = dueHours(item);
              const age = ageHours(item);
              if (due != null && due < 0) score += 650 + Math.min(240, Math.abs(due) * 5);
              else if (due != null && due <= 4) score += 360;
              else if (due != null && due <= 12) score += 240;
              else if (isDueToday(item)) score += 160;
              if (age >= 72) score += 220;
              else if (age >= 48) score += 160;
              else if (age >= 24) score += 110;
              else if (age >= 8) score += 45;
              if (item.status === "WAITING") score -= 90;
              if (item.status === "SNOOZED") score -= 180;
              return score;
            };
            const ageLabel = (item: Row) => {
              const hours = ageHours(item);
              if (hours < 1) return "aberta há menos de 1h";
              if (hours < 24) return `aberta há ${Math.floor(hours)}h`;
              const days = Math.floor(hours / 24);
              return `aberta há ${days}d`;
            };
            const dueLabel = (item: Row) => {
              if (!item.due_at) return "sem prazo";
              const due = dueHours(item);
              if (due == null) return "sem prazo";
              if (due < 0) {
                const late = Math.abs(due);
                return late < 1 ? "prazo vencido" : late < 24 ? `${Math.floor(late)}h atrasada` : `${Math.floor(late / 24)}d atrasada`;
              }
              const time = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" }).format(new Date(String(item.due_at)));
              if (isDueToday(item)) return `vence hoje ${time}`;
              if (due <= 24) return `vence em ${Math.max(1, Math.ceil(due))}h`;
              return `prazo ${formatDate(item.due_at)}`;
            };
            const slaTone = (item: Row) => isOverdue(item) ? "overdue" : (dueHours(item) != null && Number(dueHours(item)) <= 4 ? "soon" : ageHours(item) >= 24 ? "stale" : "");
            const WAIT_REASONS = [
              { value: "CLIENT", label: "Aguardando cliente" },
              { value: "GT", label: "Aguardando GT" },
              { value: "CS", label: "Aguardando CS" },
              { value: "DESIGN", label: "Aguardando Design" },
              { value: "APPROVAL", label: "Aguardando aprovação" },
              { value: "TECHNICAL", label: "Dependência técnica" },
              { value: "OTHER", label: "Outro motivo" },
            ];
            const waitingLabel = (reason: unknown) => WAIT_REASONS.find((option) => option.value === String(reason || ""))?.label || "Aguardando";

            const items: Row[] = payload.items || [];
            const roster: Row[] = payload.roster || [];
            const ranked = [...items].sort((a, b) => operationalScore(b) - operationalScore(a) || new Date(String(a.created_at || 0)).getTime() - new Date(String(b.created_at || 0)).getTime());
            const needle = workQuery.trim().toLocaleLowerCase("pt-BR");
            const visible = ranked.filter((item) => {
              const statusOk = filter === "ALL" || (filter === "OPEN" ? openItem(item) : item.status === filter);
              const personOk = personFilter === "ALL" || String(item.target_person || "") === personFilter;
              const quickOk = quickFilter === "ALL"
                || (quickFilter === "MINE" && String(item.target_person || "") === String(profile.person || ""))
                || (quickFilter === "OVERDUE" && isOverdue(item))
                || (quickFilter === "TODAY" && isDueToday(item))
                || (quickFilter === "STALE" && openItem(item) && ageHours(item) >= 24)
                || (quickFilter === "CRITICAL" && openItem(item) && item.priority === "CRITICAL")
                || (quickFilter === "UNASSIGNED" && openItem(item) && !item.target_person);
              const client = item.clients || {};
              const hay = [item.title, item.description, client.display_name, item.target_person, item.target_role, item.created_by_person, item.waiting_reason].join(" ").toLocaleLowerCase("pt-BR");
              return statusOk && personOk && quickOk && (!needle || hay.includes(needle));
            });
            const doNow = ranked.filter((item) => openItem(item) && !["WAITING", "SNOOZED"].includes(String(item.status))).slice(0, 5);

            const selectedClient = clients.find((client) => String(client.client_id) === String(form.client_id));
            const csOptions = [{ value: "Joel Antoniete", label: "Joel" }, { value: "Gustavo Lima", label: "Gustavo" }];
            const designOptions = [{ value: "Davi Nycollas", label: "Nycollas" }, { value: "Filipe Azevedo", label: "Filipe" }, { value: "Davi Henrique", label: "Davi" }];
            const assigneeOptions = String(form.target_role) === "CS" ? csOptions
              : String(form.target_role) === "DESIGN" ? designOptions
              : String(form.target_role) === "GT" ? (selectedClient?.gt_owner ? [{ value: String(selectedClient.gt_owner), label: String(selectedClient.gt_owner) }] : [])
              : String(form.target_role) === "MGMT" ? [{ value: "Adler Furtado", label: "Adler Furtado" }]
              : [];
            const assigneeLabel = (person: unknown) => {
              const value = String(person || "");
              return designOptions.find((option) => option.value === value)?.label || csOptions.find((option) => option.value === value)?.label || value || "não definido";
            };

            const canSeeTeamLoad = profile.person === "Adler Furtado" || profile.access_level === "FULL" || Boolean(profile.elevated);
            const teamSource = canSeeTeamLoad ? roster : roster.filter((person) => person.person === profile.person);
            const teamLoad = teamSource
              .filter((person) => ["CS", "DESIGN", "GT", "MGMT"].includes(String(person.role)))
              .map((person) => {
                const assigned = items.filter((item) => openItem(item) && String(item.target_person || "") === String(person.person));
                return {
                  person: String(person.person), role: String(person.role),
                  open: assigned.length,
                  today: assigned.filter(isDueToday).length,
                  overdue: assigned.filter(isOverdue).length,
                  waiting: assigned.filter((item) => item.status === "WAITING").length,
                  critical: assigned.filter((item) => item.priority === "CRITICAL").length,
                };
              })
              .filter((row) => row.open > 0 || row.person === profile.person)
              .sort((a, b) => b.overdue - a.overdue || b.critical - a.critical || b.open - a.open || a.person.localeCompare(b.person, "pt-BR"));

            function changeClient(clientId: string) {
              const client = clients.find((row) => String(row.client_id) === clientId);
              setForm((current: Row) => ({
                ...current,
                client_id: clientId,
                target_person: current.target_role === "GT" ? (client?.gt_owner || "") : current.target_person,
              }));
            }

            function changeRole(role: string) {
              const client = clients.find((row) => String(row.client_id) === String(form.client_id));
              const targetPerson = role === "CS" ? "Joel Antoniete"
                : role === "DESIGN" ? "Davi Nycollas"
                : role === "GT" ? (client?.gt_owner || "")
                : role === "MGMT" ? "Adler Furtado"
                : "";
              setForm((current: Row) => ({ ...current, target_role: role, target_person: targetPerson }));
            }

            async function createItem(event: React.FormEvent<HTMLFormElement>) {
              event.preventDefault();
              if (!form.target_person) {
                setError(form.target_role === "GT" ? "Selecione um cliente com GT responsável antes de encaminhar para Tráfego." : "Selecione o colaborador responsável pela demanda.");
                return;
              }
              setBusy("create"); setError("");
              try {
                await apiPost("work-item-create", token, { ...form, client_id: form.client_id || null, target_person: form.target_person, due_at: form.due_at ? new Date(form.due_at).toISOString() : null, create_clickup: form.type === "CLICKUP" });
                setForm({ client_id: "", type: "GENERAL", priority: "MEDIUM", target_role: "CS", target_person: "Joel Antoniete", title: "", description: "", due_at: "" });
                setFormOpen(false); await loadWork();
              } catch (caught) { setError(caught instanceof Error ? caught.message : "Falha ao criar solicitação."); }
              finally { setBusy(""); }
            }

            async function setWaiting(item: Row) {
              const id = String(item.id);
              const reason = waitingReason[id] || String(item.waiting_reason || "");
              if (!reason) { setError("Selecione por que a demanda ficará aguardando."); setExpanded(id); return; }
              setBusy(id); setError("");
              try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/agency-ops-work-item-wait-api`, {
                  method: "POST",
                  headers: { Authorization: `Bearer ${token}`, apikey: SUPABASE_ANON_KEY, "content-type": "application/json" },
                  body: JSON.stringify({ id: item.id, waiting_reason: reason }),
                });
                const json = await response.json().catch(() => null);
                if (!response.ok) throw new Error(json?.error || "Falha ao registrar o motivo de espera.");
                await loadWork();
              } catch (caught) { setError(caught instanceof Error ? caught.message : "Falha ao colocar a demanda em espera."); }
              finally { setBusy(""); }
            }

            async function updateItem(item: Row, status: string) {
              if (status === "WAITING") { await setWaiting(item); return; }
              const note = (resolution[String(item.id)] || "").trim();
              if (status === "COMPLETED" && !note) { setError("Descreva o que foi feito antes de concluir."); setExpanded(String(item.id)); return; }
              setBusy(String(item.id)); setError("");
              try { await apiPost("work-item-update", token, { id: item.id, status, resolution: note || undefined, snoozed_until: status === "SNOOZED" ? new Date(Date.now() + 86400000).toISOString() : undefined }); await loadWork(); }
              catch (caught) { setError(caught instanceof Error ? caught.message : "Falha ao atualizar solicitação."); }
              finally { setBusy(""); }
            }

            const summary = payload.summary || {};
            return <section className="workspace work-center">
              <div className="workspace-head"><div><span className="eyebrow">Mesa de despacho operacional</span><h2>Central de Trabalho</h2><p>Veja primeiro o que pode travar a operação, quem está responsável e há quanto tempo cada demanda está aberta.</p></div><button className="primary work-new" onClick={() => setFormOpen((open) => !open)}>{formOpen ? "Cancelar" : "+ Nova solicitação"}</button></div>
              <div className="grid work-kpis"><Metric label="Em aberto" value={formatNumber(summary.open, 0)} tone="blue" hint="aguardando ação" /><Metric label="Críticas" value={formatNumber(summary.critical, 0)} tone="red" hint="prioridade máxima" /><Metric label="Atrasadas" value={formatNumber(summary.overdue, 0)} tone="yellow" hint="prazo vencido" /><Metric label="Aguardando" value={formatNumber(summary.waiting, 0)} tone="yellow" hint="dependência registrada" /></div>

              {doNow.length > 0 && <section className="card work-now"><div className="work-now-head"><div><span className="eyebrow">Fazer agora</span><h3>Prioridade operacional automática</h3><p>Combina prazo, prioridade e tempo em aberto. Demandas bloqueadas ficam fora desta fila principal.</p></div><span className="counter">{doNow.length} prioridades</span></div><div className="work-now-list">{doNow.map((item) => { const client = item.clients || {}; return <button key={item.id} onClick={() => { setExpanded(String(item.id)); setFilter("ALL"); window.setTimeout(() => document.getElementById(`work-${item.id}`)?.scrollIntoView({ behavior: "smooth", block: "center" }), 80); }}><span className={`work-sla ${slaTone(item)}`}>{dueLabel(item)}</span><span><b>{text(item.title)}</b><small>{text(client.display_name || "Solicitação geral")} · {assigneeLabel(item.target_person || item.target_role)} · {ageLabel(item)}</small></span><Chip value={item.priority} /></button>; })}</div></section>}

              {formOpen && <form className="card work-form" onSubmit={createItem}><div className="section-title">Criar solicitação</div><div className="work-form-grid"><label>Cliente<select className="control" value={form.client_id} onChange={(event) => changeClient(event.target.value)}><option value="">Solicitação geral</option>{clients.map((client) => <option key={client.client_id} value={client.client_id}>{client.display_name}</option>)}</select></label><label>Tipo<select className="control" value={form.type} onChange={(event) => setForm((current: Row) => ({ ...current, type: event.target.value }))}><option value="GENERAL">Geral</option><option value="ESCALATION">Escalonamento</option><option value="CREATIVE_REQUEST">Solicitação para designer</option><option value="TECHNICAL">Problema técnico</option><option value="CLIENT_FOLLOWUP">Acompanhamento do cliente</option><option value="CLICKUP">Criar também no ClickUp</option></select></label><label>Área responsável<select className="control" value={form.target_role} onChange={(event) => changeRole(event.target.value)}><option value="CS">CS</option><option value="DESIGN">Designer</option><option value="GT">Gestor de Tráfego</option><option value="MGMT">Operações</option></select></label><label>Encaminhar para<select className="control" value={form.target_person || ""} onChange={(event) => setForm((current: Row) => ({ ...current, target_person: event.target.value }))} disabled={form.target_role === "GT" && !selectedClient?.gt_owner}>{form.target_role === "GT" && !selectedClient?.gt_owner && <option value="">{form.client_id ? "Cliente sem GT definido" : "Selecione o cliente primeiro"}</option>}{assigneeOptions.map((option) => <option key={option.value} value={option.value}>{option.label}</option>)}</select></label><label>Prioridade<select className="control" value={form.priority} onChange={(event) => setForm((current: Row) => ({ ...current, priority: event.target.value }))}><option value="CRITICAL">Crítica</option><option value="HIGH">Alta</option><option value="MEDIUM">Média</option><option value="LOW">Baixa</option></select></label><label>Prazo<input className="control" type="datetime-local" value={form.due_at} onChange={(event) => setForm((current: Row) => ({ ...current, due_at: event.target.value }))} /></label></div><label>Título<input className="control" required value={form.title} onChange={(event) => setForm((current: Row) => ({ ...current, title: event.target.value }))} placeholder="O que precisa ser feito" /></label><label>Contexto<textarea className="control" value={form.description} onChange={(event) => setForm((current: Row) => ({ ...current, description: event.target.value }))} placeholder="Explique o problema, a evidência e o resultado esperado" /></label><div className="work-form-footer"><span>{form.target_person ? `Será encaminhada para ${assigneeLabel(form.target_person)}` : form.target_role === "GT" ? "O GT é definido pela carteira do cliente" : "Selecione quem receberá a demanda"}</span><button className="primary" disabled={busy === "create" || !form.target_person}>{busy === "create" ? "Criando…" : "Criar e notificar"}</button></div></form>}

              {teamLoad.length > 0 && <section className="card work-team"><div className="section-head"><div><div className="section-title">Carga por colaborador</div><div className="subtitle">Clique em uma pessoa para filtrar a fila. {canSeeTeamLoad ? "Visão consolidada das demandas abertas." : "Mostrando apenas sua carga visível."}</div></div></div><div className="table-wrap"><table><thead><tr><th>Responsável</th><th>Abertas</th><th>Hoje</th><th>Atrasadas</th><th>Aguardando</th><th>Críticas</th></tr></thead><tbody>{teamLoad.map((row) => <tr key={row.person} onClick={() => { setPersonFilter(row.person); setFilter("OPEN"); setQuickFilter("ALL"); }}><td><b>{row.person}</b><div className="small">{row.role}</div></td><td>{row.open}</td><td>{row.today}</td><td className={row.overdue ? "red" : ""}>{row.overdue}</td><td>{row.waiting}</td><td className={row.critical ? "red" : ""}>{row.critical}</td></tr>)}</tbody></table></div></section>}

              {error && <div className="error-box">{error}</div>}
              <section className="card work-controls"><div className="work-control-row"><input className="control work-search" value={workQuery} onChange={(event) => setWorkQuery(event.target.value)} placeholder="Buscar demanda, cliente ou responsável" /><select className="control" value={personFilter} onChange={(event) => setPersonFilter(event.target.value)}><option value="ALL">Todos os responsáveis</option>{roster.filter((person) => ["CS", "DESIGN", "GT", "MGMT"].includes(String(person.role))).map((person) => <option key={person.person} value={person.person}>{person.person} · {person.role}</option>)}</select></div><div className="filter-tabs work-quick-filters">{[["ALL","Tudo"],["MINE","Minhas"],["OVERDUE","Atrasadas"],["TODAY","Vencem hoje"],["STALE","Paradas +24h"],["CRITICAL","Críticas"],["UNASSIGNED","Sem responsável"]].map(([key,label]) => <button key={key} className={quickFilter === key ? "active" : ""} onClick={() => setQuickFilter(key)}>{label}</button>)}</div></section>

              <div className="filter-tabs work-filters">{[["OPEN", "Em aberto"], ["IN_PROGRESS", "Em andamento"], ["WAITING", "Aguardando"], ["SNOOZED", "Adiados"], ["COMPLETED", "Concluídos"], ["ALL", "Todos"]].map(([key, label]) => <button key={key} className={filter === key ? "active" : ""} onClick={() => setFilter(key)}>{label}</button>)}</div>
              <div className="work-list">{visible.map((item) => { const open = expanded === String(item.id); const client = item.clients || {}; const routedTo = assigneeLabel(item.target_person || item.target_role); const wait = waitingReason[String(item.id)] || String(item.waiting_reason || ""); return <article id={`work-${item.id}`} className={`card work-item${open ? " expanded" : ""}`} key={item.id}><button className="work-item-main" onClick={() => setExpanded(open ? null : String(item.id))}><Chip value={item.priority} /><span><b>{text(item.title)}</b><small>{text(client.display_name || "Solicitação geral")} · encaminhada para {text(routedTo)} · {ageLabel(item)}</small>{item.status === "WAITING" && <small className="work-wait-label">{waitingLabel(item.waiting_reason)}{item.waiting_since ? ` · desde ${formatDate(item.waiting_since)}` : ""}</small>}</span><span className="work-item-right"><span className={`work-sla ${slaTone(item)}`}>{dueLabel(item)}</span><Chip value={item.status} /></span></button>{open && <div className="work-item-detail"><p>{text(item.description || "Sem descrição adicional.")}</p><div className="work-meta"><span>Encaminhada para: {text(routedTo)}</span><span>Área: {text(item.target_role)}</span><span>{ageLabel(item)}</span><span>Prazo: {dueLabel(item)}</span>{item.status === "WAITING" && <span>{waitingLabel(item.waiting_reason)}</span>}{item.completed_by && <span>Concluída por {text(item.completed_by)}</span>}</div>{item.metadata?.clickup_url && <a className="work-clickup" href={item.metadata.clickup_url} target="_blank" rel="noreferrer">Abrir tarefa no ClickUp ↗</a>}{!["COMPLETED", "DISMISSED"].includes(item.status) && <><div className="work-waiting-controls"><label>Se for aguardar, registre o motivo<select className="control" value={wait} onChange={(event) => setWaitingReason((current) => ({ ...current, [String(item.id)]: event.target.value }))}><option value="">Selecione…</option>{WAIT_REASONS.map((option) => <option key={option.value} value={option.value}>{option.label}</option>)}</select></label></div><textarea className="control" value={resolution[String(item.id)] || ""} onChange={(event) => setResolution((current) => ({ ...current, [String(item.id)]: event.target.value }))} placeholder="Registre o que foi feito, a decisão ou o motivo…" /><div className="work-actions"><button disabled={busy === String(item.id)} onClick={() => updateItem(item, "IN_PROGRESS")}>Iniciar</button><button disabled={busy === String(item.id)} onClick={() => updateItem(item, "WAITING")}>Aguardando</button><button disabled={busy === String(item.id)} onClick={() => updateItem(item, "SNOOZED")}>Adiar 1 dia</button><button className="success" disabled={busy === String(item.id)} onClick={() => updateItem(item, "COMPLETED")}>Concluir</button><button className="muted" disabled={busy === String(item.id)} onClick={() => updateItem(item, "DISMISSED")}>Descartar</button></div></>}{item.status === "COMPLETED" && item.resolution && <div className="work-resolution"><b>Conclusão</b><p>{text(item.resolution)}</p></div>}</div>}</article>; })}{!loading && !visible.length && <div className="card empty">Nenhuma solicitação nesse filtro.</div>}{loading && <div className="card empty">Carregando solicitações…</div>}</div>
            </section>;
          }'''

          pattern = r'function WorkCenter\(\{ token, clients, profile, focusId, clearFocus \}.*?\n\}\n\nfunction AIAskWidget'
          replacement = new_function + '\n\nfunction AIAskWidget'
          patched, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'WorkCenter replacement count={count}')
          path.write_text(patched)

          css_path = Path('app/globals.css')
          css = css_path.read_text()
          marker = '/* work-center-v2 */'
          if marker not in css:
              css += r'''

/* work-center-v2 */
.work-now{margin-bottom:14px;padding:17px;overflow:hidden}.work-now-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:11px}.work-now-head h3{margin:4px 0 4px;font-size:16px}.work-now-head p{margin:0;color:var(--muted);font-size:12px}.work-now-list{display:grid;gap:7px}.work-now-list>button{width:100%;display:grid;grid-template-columns:120px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);text-align:left;cursor:pointer}.work-now-list>button:hover{border-color:var(--blue);background:var(--wash)}.work-now-list b,.work-now-list small{display:block}.work-now-list b{font-size:12px}.work-now-list small{color:var(--muted);font-size:11px;margin-top:3px}.work-sla{display:inline-flex;align-items:center;justify-content:center;width:max-content;max-width:150px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px;font-weight:750;white-space:nowrap}.work-sla.overdue{color:#ff9aa2;border-color:rgba(255,107,117,.35);background:rgba(255,107,117,.08)}.work-sla.soon{color:#ffe08b;border-color:rgba(247,201,92,.34);background:rgba(247,201,92,.07)}.work-sla.stale{color:#bdaaff;border-color:rgba(169,139,255,.3);background:rgba(169,139,255,.06)}
.work-team{padding:17px;margin-bottom:14px}.work-team .table-wrap{max-height:280px}.work-team tbody tr{cursor:pointer}.work-team td:not(:first-child){font-variant-numeric:tabular-nums;font-weight:700}.work-controls{padding:12px 14px;margin-bottom:10px}.work-control-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.work-search{flex:1;min-width:260px!important}.work-quick-filters{margin:9px 0 0}.work-item-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.work-wait-label{color:var(--yellow)!important}.work-waiting-controls{margin-top:13px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.work-waiting-controls label{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}.work-waiting-controls select{min-width:230px}.work-item-main{grid-template-columns:auto minmax(0,1fr) auto}
@media(max-width:800px){.work-now-list>button{grid-template-columns:1fr auto}.work-now-list .work-sla{grid-column:1/-1}.work-control-row{display:grid;grid-template-columns:1fr}.work-search{min-width:0!important}.work-waiting-controls label{align-items:stretch;flex-direction:column}.work-waiting-controls select{min-width:0}.work-item-right{grid-column:2;justify-content:flex-start}.work-item-main{grid-template-columns:auto minmax(0,1fr)}}
'''
              css_path.write_text(css)
          PY

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      dashboard-production:
        dependency-type: production

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: friday
      time: "09:15"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      ai-server-production:
        dependency-type: production

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Briefing Hub">
  <title>Briefing Hub</title>
  <!--
    Marca do Briefing Hub: um briefing (documento com respostas) que se ramifica
    em decisoes (o grafo de nos). O azul entra pela esquerda e o laranja sai
    pela direita, atravessando o no central — a mesma dupla de cores do
    Agency Ops.

    Tracada em stroke com `vector-effect` ausente de proposito: em tamanhos
    grandes a espessura acompanha a escala, que e o comportamento certo aqui.
  -->
  <defs>
    <linearGradient id="bh-anel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E90FA"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- documento, com o canto dobrado -->
  <path d="M18 5h17.5L46 15.5V37a3.5 3.5 0 0 1-3.5 3.5h-21A3.5 3.5 0 0 1 18 37V8.5A3.5 3.5 0 0 1 21.5 5Z"
        fill="none" stroke="#8A93A5" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M35.5 5v7a3.5 3.5 0 0 0 3.5 3.5h7"
        fill="none" stroke="#8A93A5" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- tres respostas: a primeira e a ultima carregam as cores da marca -->
  <circle cx="24.5" cy="16.5" r="1.8" fill="#2E90FA"/>
  <path d="M29.5 16.5h11" stroke="#2E90FA" stroke-width="2.4" stroke-linecap="round"/>

  <circle cx="24.5" cy="23.5" r="1.8" fill="#6B7280"/>
  <path d="M29.5 23.5h11" stroke="#6B7280" stroke-width="2.4" stroke-linecap="round"/>

  <circle cx="24.5" cy="30.5" r="1.8" fill="#F97316"/>
  <path d="M29.5 30.5h11" stroke="#F97316" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ramificacao: bracos horizontais e tres saidas para baixo -->
  <path d="M17 43h9" stroke="#2E90FA" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M38 43h9" stroke="#F97316" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 49.5v4.5M29 48.6l-4.6 3.6M35 48.6l4.6 3.6"
        stroke="#5A6273" stroke-width="2.4" stroke-linecap="round"/>

  <circle cx="14" cy="43" r="3.5" fill="#2E90FA"/>
  <circle cx="50" cy="43" r="3.5" fill="#F97316"/>
  <circle cx="22.5" cy="54.5" r="3" fill="#5A6273"/>
  <circle cx="32" cy="56.5" r="3" fill="#5A6273"/>
  <circle cx="41.5" cy="54.5" r="3" fill="#5A6273"/>

  <!-- no central: anel azul->laranja com o miolo cheio -->
  <circle cx="32" cy="43" r="6.3" fill="#11161F" stroke="url(#bh-anel)" stroke-width="2.6"/>
  <circle cx="32" cy="43" r="2.7" fill="#5A6273"/>
</svg>

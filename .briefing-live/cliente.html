<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Briefing Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f6f8;
        color: #16181d;
        font:
          14px Inter,
          Arial,
          sans-serif;
      }
      .login {
        max-width: 420px;
        margin: 11vh auto;
      }
      .card {
        background: white;
        border: 1px solid #e3e6ea;
        border-radius: 14px;
        padding: 18px;
      }
      .brand {
        font-size: 23px;
        font-weight: 800;
        margin-bottom: 20px;
      }
      .brand span {
        color: #625cff;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .shell {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }
      .side {
        background: #15171c;
        color: #fff;
        padding: 22px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .side button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        color: #c8cbd2;
        border: 0;
        padding: 11px;
        border-radius: 8px;
        margin: 4px 0;
      }
      .side button.on {
        background: #292c34;
        color: white;
      }
      .main {
        padding: 28px;
        max-width: 1300px;
        width: 100%;
      }
      .top,
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .between {
        justify-content: space-between;
      }
      .btn {
        border: 1px solid #d9dde3;
        background: white;
        padding: 9px 12px;
        border-radius: 9px;
        cursor: pointer;
      }
      .primary {
        background: #17191f;
        color: #fff;
        border-color: #17191f;
      }
      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid #d9dde3;
        border-radius: 8px;
        padding: 10px;
        background: #fff;
      }
      .muted {
        color: #747984;
      }
      .cards {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        margin-top: 14px;
      }
      .pill {
        font-size: 11px;
        padding: 4px 7px;
        border-radius: 20px;
        background: #eef0f4;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #0008;
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 10;
      }
      .modal > .box {
        background: #fff;
        border-radius: 14px;
        padding: 20px;
        width: min(1000px, 100%);
        max-height: 92vh;
        overflow: auto;
      }
      .field label {
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
      }
      .section {
        margin-top: 22px;
        border-top: 1px solid #eee;
        padding-top: 14px;
      }
      .form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .history {
        display: grid;
        gap: 9px;
      }
      .hist {
        padding: 12px;
        border: 1px solid #eee;
        border-radius: 9px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #eee;
        text-align: left;
      }
      .qline {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .qhelp {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border: 1px solid #cfd4dc;
        border-radius: 50%;
        font-size: 12px;
        font-weight: 800;
        color: #5f6570;
        cursor: help;
        flex: 0 0 auto;
      }
      .qhelp .tip {
        display: none;
        position: absolute;
        z-index: 40;
        left: 24px;
        top: -8px;
        width: min(370px, 78vw);
        background: #17191f;
        color: #fff;
        border-radius: 10px;
        padding: 12px;
        font-weight: 400;
        line-height: 1.45;
        box-shadow: 0 10px 30px #0003;
      }
      .qhelp:hover .tip,
      .qhelp:focus .tip {
        display: block;
      }
      .qhelp .tip b {
        display: block;
        margin-top: 7px;
      }
      .qhelp .tip b:first-child {
        margin-top: 0;
      }
      .unknown {
        margin-top: 7px;
        border: 0;
        background: #f0f1f4;
        padding: 7px 9px;
        border-radius: 7px;
        cursor: pointer;
        color: #555;
      }
      .internalhint {
        font-size: 11px;
        color: #7c6330;
        background: #fff8df;
        border: 1px solid #f0dfa0;
        padding: 6px 8px;
        border-radius: 7px;
        margin: 5px 0;
      }
      .field[hidden] {
        display: none !important;
      }
      select[multiple] {
        min-height: 115px;
      }
      @media (max-width: 760px) {
        .shell {
          grid-template-columns: 1fr;
        }
        .side {
          height: auto;
          position: static;
        }
        .main {
          padding: 16px;
        }
        .form {
          grid-template-columns: 1fr;
        }
      }
      /* EXACT AGENCY OPS DASHBOARD VISUAL SYSTEM Ã¢ÂÂ sourced from layout.DgD_6PVq.css */
      :root {
        color-scheme: dark;
        --brand: #0359a6;
        --brand-mid: #02437d;
        --brand-deep: #01172a;
        --brand-ink: #000101;
        --accent: #ff7a2f;
        --accent-soft: #f26b2124;
        --bg: #070a0d;
        --panel: #14191e;
        --panel2: #0e1317;
        --line: #35414b;
        --text: #edf4f8;
        --muted: #a6b4bf;
        --green: #31d49b;
        --yellow: #f7c95c;
        --red: #ff6b75;
        --blue: #76c6ff;
        --purple: #a98bff;
        --shadow: 0 14px 34px #00000047;
        --wash: #76c6ff16;
      }
      html {
        background: var(--bg) !important;
        color: var(--text) !important;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif !important;
      }
      body {
        background:
          radial-gradient(circle at 10% -8%, #76c6ff1a, transparent 29rem),
          radial-gradient(circle at 92% 1%, #ff7a2f21, transparent 27rem),
          var(--bg) !important;
        color: var(--text) !important;
        min-height: 100vh;
        margin: 0;
        transition:
          background 0.25s,
          color 0.25s;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      .auth-shell {
        background: var(--bg) !important;
        grid-template-columns: minmax(0, 1.06fr) minmax(0, 1fr) !important;
        place-items: stretch stretch !important;
        gap: 0 !important;
        min-height: 100vh !important;
        padding: 0 !important;
        display: grid !important;
        color: var(--text) !important;
      }
      .auth-aside {
        color: #fff !important;
        background: linear-gradient(
          133deg,
          var(--brand) 0%,
          var(--brand-mid) 36%,
          var(--brand-deep) 72%,
          var(--brand-ink) 100%
        ) !important;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
        padding: 56px clamp(36px, 6vw, 86px);
        display: flex;
        position: relative;
        overflow: hidden;
      }
      .auth-aside:before {
        content: "";
        pointer-events: none;
        background: radial-gradient(circle at 8% 6%, #ffffff29, #0000 46%);
        position: absolute;
        inset: 0;
      }
      .auth-aside > * {
        position: relative;
      }
      .auth-aside-mark {
        color: #fff;
        width: clamp(58px, 7vw, 84px);
      }
      .auth-aside-mark svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .auth-aside-word b {
        letter-spacing: 0.11em;
        text-transform: uppercase;
        font-family: "Inter Tight", Inter, sans-serif;
        font-size: clamp(27px, 3.1vw, 38px);
        font-weight: 600;
        line-height: 1.1;
        display: block;
      }
      .auth-aside-word span {
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #ffffffb8;
        margin-top: 11px;
        font-size: clamp(10px, 1.05vw, 12px);
        font-weight: 500;
        display: block;
      }
      .auth-aside-note {
        color: #ffffffad;
        border-top: 1px solid #ffffff29;
        max-width: 32ch;
        margin: 0;
        padding-top: 22px;
        font-size: 13.5px;
        line-height: 1.6;
      }
      .auth-card {
        width: min(410px, 100%) !important;
        box-shadow: none !important;
        background: transparent !important;
        border: 0 !important;
        border-radius: 0 !important;
        place-self: center !important;
        padding: 0 !important;
      }
      .auth-head {
        margin-bottom: 26px;
      }
      .auth-head .eyebrow {
        color: var(--brand) !important;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 10px;
        font-weight: 800;
      }
      .auth-head h1 {
        margin: 9px 0 7px !important;
        font-family: "Inter Tight", Inter, sans-serif;
        font-size: 27px !important;
        letter-spacing: -0.02em;
        color: var(--text) !important;
      }
      .auth-head p {
        color: var(--muted) !important;
        margin: 0;
        font-size: 13px;
      }
      .auth-card form,
      .auth-card label {
        gap: 7px;
        display: grid;
      }
      .auth-card form {
        gap: 15px;
      }
      .auth-card label {
        color: var(--muted) !important;
        gap: 8px;
        font-size: 11.5px;
        font-weight: 600;
      }
      .auth-card input,
      .auth-card select {
        border: 1px solid var(--line) !important;
        background: var(--panel2) !important;
        width: 100%;
        color: var(--text) !important;
        border-radius: 11px !important;
        outline: 0;
        padding: 13px 14px !important;
        font-size: 14px !important;
        transition:
          border-color 0.16s,
          box-shadow 0.16s;
      }
      .auth-card input::placeholder {
        color: color-mix(in srgb, var(--muted) 72%, transparent);
      }
      .auth-card input:focus,
      .auth-card select:focus {
        border-color: var(--brand) !important;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent) !important;
      }
      .auth-submit {
        background: var(--accent) !important;
        color: #1a0c02 !important;
        cursor: pointer;
        border: 0 !important;
        border-radius: 11px !important;
        padding: 13px !important;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.01em;
        transition:
          filter 0.16s,
          transform 0.16s,
          box-shadow 0.16s;
        box-shadow: 0 8px 20px #f26b2129;
      }
      .auth-submit:hover:not(:disabled) {
        filter: brightness(1.06);
        transform: translateY(-1px);
        box-shadow: 0 12px 26px #f26b213d;
      }
      .auth-submit:active:not(:disabled) {
        transform: translateY(0);
      }
      .auth-error {
        color: var(--red);
        font-size: 11px;
        min-height: 16px;
        line-height: 1.4;
      }
      .bh-shell {
        display: block !important;
        min-height: 100vh !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 0 0 250px !important;
        background: transparent !important;
        color: var(--text) !important;
      }
      .bh-shell .side-nav {
        background: var(--panel2) !important;
        border-right: 1px solid var(--line) !important;
        z-index: 40;
        flex-direction: column;
        gap: 4px;
        width: 224px;
        height: 100vh;
        padding: 18px 10px;
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        overflow: hidden auto;
      }
      .bh-side-brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 4px 7px 17px;
        margin-bottom: 9px;
        border-bottom: 1px solid var(--line);
      }
      .bh-side-logo {
        background: linear-gradient(
          120deg,
          var(--brand) 0%,
          var(--brand-mid) 46%,
          var(--brand-deep) 100%
        );
        color: #fff;
        border-radius: 12px;
        place-items: center;
        width: 42px;
        height: 42px;
        display: grid;
        box-shadow: 0 10px 28px #0359a657;
        font:
          800 10px Inter,
          sans-serif;
      }
      .bh-side-brand b {
        display: block;
        color: var(--text);
        font-family: "Inter Tight", Inter, sans-serif;
        font-size: 15px;
        letter-spacing: -0.015em;
      }
      .bh-side-brand small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.11em;
      }
      .bh-shell #nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .bh-shell #nav button {
        white-space: nowrap;
        text-overflow: ellipsis;
        width: 100% !important;
        color: var(--muted) !important;
        cursor: pointer;
        text-align: left !important;
        background: transparent !important;
        border: 0 !important;
        border-radius: 8px !important;
        padding: 10px 12px !important;
        margin: 0 !important;
        font-size: 13px !important;
        display: block;
        overflow: hidden;
      }
      .bh-shell #nav button:hover {
        color: var(--text) !important;
        background: var(--wash) !important;
      }
      .bh-shell #nav button.on {
        color: var(--text) !important;
        box-shadow: inset 3px 0 var(--accent) !important;
        background: #0359a63d !important;
      }
      .bh-side-footer {
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .bh-shell #out {
        white-space: nowrap;
        width: 100% !important;
        color: var(--muted) !important;
        cursor: pointer;
        text-align: left !important;
        background: transparent !important;
        border: 0 !important;
        border-radius: 8px !important;
        padding: 10px 12px !important;
        font-size: 13px !important;
      }
      .bh-shell #out:hover {
        color: var(--text) !important;
        background: var(--wash) !important;
      }
      .bh-shell .main {
        display: block !important;
        max-width: none !important;
        width: 100% !important;
        min-width: 0 !important;
        min-height: 100vh !important;
        padding: 0 !important;
        background: transparent !important;
        color: var(--text) !important;
      }
      .bh-main-frame {
        max-width: 1480px;
        margin: auto;
        padding: 26px;
      }
      .bh-shell #view > h2,
      .bh-shell #view > .row:first-child h2 {
        letter-spacing: -0.02em;
        margin: 0;
        font-family: "Inter Tight", Inter, sans-serif;
        font-size: 21px;
        color: var(--text);
      }
      .bh-shell #view > p.muted,
      .bh-shell .muted {
        color: var(--muted) !important;
      }
      .bh-shell #view > .row:first-child {
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        margin-bottom: 22px;
        display: flex;
      }
      .bh-shell .card {
        background: var(--panel) !important;
        border: 1px solid var(--line) !important;
        box-shadow: var(--shadow) !important;
        border-radius: 17px !important;
        color: var(--text) !important;
        padding: 17px !important;
      }
      .bh-shell .cards {
        gap: 14px !important;
        margin-top: 14px !important;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important;
      }
      .bh-shell .cards > .card:hover {
        border-color: var(--blue) !important;
        transform: translateY(-1px);
      }
      .bh-shell .btn {
        border: 1px solid var(--line) !important;
        color: var(--text) !important;
        cursor: pointer !important;
        background: #132640 !important;
        border-radius: 10px !important;
        padding: 9px 12px !important;
        font-weight: 600 !important;
      }
      .bh-shell .btn:hover {
        border-color: var(--blue) !important;
      }
      .bh-shell .btn.primary {
        background: var(--accent) !important;
        border-color: var(--accent) !important;
        color: #1a0c02 !important;
        font-weight: 900 !important;
        box-shadow: 0 8px 22px #f26b2142 !important;
      }
      .bh-shell input,
      .bh-shell textarea,
      .bh-shell select {
        border: 1px solid var(--line) !important;
        background: var(--panel2) !important;
        color: var(--text) !important;
        border-radius: 10px !important;
        outline: 0 !important;
        padding: 12px !important;
      }
      .bh-shell input:focus,
      .bh-shell textarea:focus,
      .bh-shell select:focus {
        border-color: var(--blue) !important;
      }
      .bh-shell input::placeholder,
      .bh-shell textarea::placeholder {
        color: var(--muted) !important;
      }
      .bh-shell .field label,
      .bh-shell label {
        color: var(--muted) !important;
        font-size: 11px !important;
      }
      .bh-shell .pill {
        letter-spacing: 0.04em;
        border: 1px solid var(--line) !important;
        white-space: nowrap;
        border-radius: 999px !important;
        align-items: center;
        padding: 4px 8px !important;
        font-size: 10px !important;
        font-weight: 800 !important;
        display: inline-flex;
        background: var(--panel2) !important;
        color: var(--muted) !important;
      }
      .bh-shell table {
        border-collapse: collapse !important;
        width: 100% !important;
        font-size: 13px !important;
      }
      .bh-shell th {
        color: var(--muted) !important;
        text-transform: uppercase !important;
        letter-spacing: 0.07em !important;
        text-align: left !important;
        border-bottom: 1px solid var(--line) !important;
        background: #0b1829 !important;
        padding: 11px !important;
        font-size: 10px !important;
      }
      .bh-shell td {
        vertical-align: top !important;
        border-bottom: 1px solid #22344ba6 !important;
        padding: 12px 11px !important;
        color: var(--text) !important;
      }
      .bh-shell tbody tr:hover {
        background: var(--wash) !important;
      }
      .bh-shell .section {
        margin-top: 22px !important;
        border-top: 1px solid var(--line) !important;
        padding-top: 14px !important;
      }
      .bh-shell .hist {
        padding: 12px !important;
        border: 1px solid var(--line) !important;
        border-radius: 11px !important;
        background: var(--panel2) !important;
      }
      .bh-shell .qhelp {
        border-color: var(--line) !important;
        color: var(--muted) !important;
        background: var(--panel2) !important;
      }
      .bh-shell .qhelp .tip {
        background: var(--panel) !important;
        color: var(--text) !important;
        border: 1px solid var(--line) !important;
        box-shadow: var(--shadow) !important;
      }
      .bh-shell .unknown {
        background: var(--panel2) !important;
        color: var(--muted) !important;
        border: 1px solid var(--line) !important;
      }
      .bh-shell .internalhint {
        color: var(--yellow) !important;
        background: #f7c95c12 !important;
        border-color: #f7c95c4d !important;
      }
      .modal {
        background: #000b !important;
        backdrop-filter: blur(7px) !important;
      }
      .modal > .box {
        background: var(--panel) !important;
        color: var(--text) !important;
        border: 1px solid var(--line) !important;
        border-radius: 17px !important;
        box-shadow: var(--shadow) !important;
      }
      .modal .btn {
        border: 1px solid var(--line) !important;
        color: var(--text) !important;
        background: #132640 !important;
        border-radius: 10px !important;
      }
      .modal .btn.primary {
        background: var(--accent) !important;
        border-color: var(--accent) !important;
        color: #1a0c02 !important;
      }
      .modal input,
      .modal textarea,
      .modal select {
        border: 1px solid var(--line) !important;
        background: var(--panel2) !important;
        color: var(--text) !important;
        border-radius: 10px !important;
      }
      .modal label {
        color: var(--muted) !important;
      }
      @media (max-width: 900px) {
        .auth-shell {
          grid-template-columns: 1fr !important;
          align-items: start !important;
        }
        .auth-aside {
          flex-direction: row;
          align-items: center;
          gap: 16px;
          padding: 26px 22px;
        }
        .auth-aside-mark {
          flex-shrink: 0;
          width: 38px;
        }
        .auth-aside-word b {
          letter-spacing: 0.09em;
          font-size: 19px;
        }
        .auth-aside-word span {
          letter-spacing: 0.3em;
          margin-top: 5px;
          font-size: 9px;
        }
        .auth-aside-note {
          display: none;
        }
        .auth-card {
          padding: 30px 22px 40px !important;
        }
        .bh-shell {
          padding-left: 84px !important;
        }
        .bh-shell .side-nav {
          width: 58px !important;
        }
        .bh-side-brand > div:last-child {
          display: none;
        }
        .bh-side-brand {
          justify-content: center;
          padding-left: 0;
          padding-right: 0;
        }
        .bh-side-logo {
          width: 38px;
          height: 38px;
        }
        .bh-shell #nav button {
          font-size: 0 !important;
          padding: 10px !important;
          text-align: center !important;
        }
        .bh-shell #nav button:before {
          content: attr(data-v);
          font-size: 7px;
          text-transform: uppercase;
          color: inherit;
        }

      function sectionOrderV2(type) {
        return type === "PRODUCT"
          ? [

      function valsV2(b) {
        let z = {};
        Object.entries(b.answers || {}).forEach(([k, x]) => (z[k] = x.value));
        return z;
      }
      function ruleV2(rule, vals) {
        if (!rule) return true;
        let v = vals[rule.key];
        if (rule.notEmpty) return filledV2(v);
        if (rule.in) return rule.in.includes(v);
        if (rule.notIn) return !rule.notIn.includes(v);
        if (rule.containsAny) {
          let a = Array.isArray(v) ? v : [v];
          return a.some((x) => rule.containsAny.includes(x));
        }
        return true;
      }
      function filledV2(v) {
        return (
          v != null &&
          (typeof v !== "string" || v.trim() !== "") &&
          (!Array.isArray(v) || v.length > 0)
        );
      }
      function isRequiredV2(q, b) {
        let v = valsV2(b);
        return (
          q.required === 1 ||
          q.required === true ||
          (q.required_when && ruleV2(q.required_when, v))
        );
      }
      function relevantQuestionsV2(b, type, mode) {
        let vals = valsV2(b),
          quick = new Set([]);
        let qs = b.questions.filter(
          (q) => !q.show_when || ruleV2(q.show_when, vals),
        );
        if (mode === "COMPLETE") return qs;
        return qs.filter(
          (q) => isRequiredV2(q, b) || quick.has(q.question_key),
        );
      }
      function buildStepsV2(b, type, mode) {
        let qs = relevantQuestionsV2(b, type, mode),
          order = sectionOrderV2(type),
          sections = [...new Set(qs.map((q) => q.section_name))].sort(
            (a, b) => {
              let ia = order.indexOf(a),
                ib = order.indexOf(b);
              return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
            },
          ),
          steps = [];
        sections.forEach((s, si) => {
          let arr = qs
            .filter((q) => q.section_name === s)
            .sort((a, b) => a.position - b.position);
          for (let i = 0; i < arr.length; i += 4)
            steps.push({
              kind: "questions",
              section: s,
              index: si,
              questions: arr.slice(i, i + 4),
            });
        });
        return steps;
      }

      async function briefingMode(type, id, opts) {

          A("/api/client/progress?type=" + type + "&id=" + id),

              filledV2(x.value),
            ),

          step: Number(pr.progress?.current_step || 0),
          saveTimer: {},

      async function saveBriefAnswerV2(key, value, nowSave) {
        let bm = S.bm,
          s = $("#saveState"),
          ver = (bm.saveVersion[key] || 0) + 1;
        bm.saveVersion[key] = ver;
        bm.b.answers[key] = { value };
        bm.flags.delete(key);
        if (s) {
          s.textContent = "Salvando…";
          s.classList.remove("ok");
        }
        let req = (bm.saveChains[key] || Promise.resolve())
          .catch(() => {})
          .then(() =>
            A("/api/client/answer", {
              method: "PUT",
              body: JSON.stringify({ type: bm.type, id: bm.id, key, value }),
            }),
          );
        bm.saveChains[key] = req;
        bm.pendingSaves[key] = req;
        try {
          await req;
          if (S.bm === bm && bm.saveVersion[key] === ver && s) {
            s.textContent = "✓ Salvo";
            s.classList.add("ok");
          }
          return true;
        } catch (e) {
          if (S.bm === bm && bm.saveVersion[key] === ver && s) {
            s.textContent = "Erro ao salvar · tente novamente";
            s.classList.remove("ok");
          }
          return false;
        } finally {
          if (bm.pendingSaves[key] === req) delete bm.pendingSaves[key];
        }
      }
      async function setReviewV2(key, on) {
        let bm = S.bm,
          was = bm.flags.has(key),
          pendingKey = "flag:" + key;
        on ? bm.flags.add(key) : bm.flags.delete(key);
        let req = A("/api/client/review-flag", {
          method: "PUT",
          body: JSON.stringify({
            type: bm.type,
            id: bm.id,
            key,
            review_needed: on,
          }),
        });
        bm.pendingSaves[pendingKey] = req;
        try {
          await req;
          return true;
        } catch (e) {
          was ? bm.flags.add(key) : bm.flags.delete(key);
          let s = $("#saveState");
          if (s) s.textContent = "Erro ao salvar · tente novamente";
          return false;
        } finally {
          if (bm.pendingSaves[pendingKey] === req)
            delete bm.pendingSaves[pendingKey];
        }
      }
      async function uploadFileV2(key, file) {
        if (file.size > 5 * 1024 * 1024)
          return alert(
            "Este arquivo ultrapassa 5 MB. Para arquivos maiores, inclua um link no campo de resposta.",
          );

            method: "POST",

              type: bm.type,
              id: bm.id,

              file_name: file.name,

      function validateStepV2(step) {
        let bm = S.bm,
          ok = true;
        if (step.kind !== "questions") return true;
        step.questions.forEach((q) => {
          let req = isRequiredV2(q, bm.b),
            el = $('[data-binput="' + q.question_key + '"]'),
            value = el ? el.value : bm.b.answers[q.question_key]?.value,
            done = filledV2(value) || bm.flags.has(q.question_key),
            card = $('[data-qcard="' + q.question_key + '"]'),
            er = $('[data-qerror="' + q.question_key + '"]');
          if (req && !done) {
            ok = false;
            card?.classList.add("has-error");
            if (er)
              er.textContent =
                "Precisamos desta informação para avançar — ou marque para o time analisar.";
          } else {
            card?.classList.remove("has-error");
            if (er) er.textContent = "";
          }
        });
        return ok;
      }
      async function goBriefV2(delta) {
        let bm = S.bm,
          old = bm.steps?.[bm.step];
        if (delta > 0 && !validateStepV2(old)) return;
        let steps = buildStepsV2(bm.b, bm.type, bm.mode);
        if (!steps.length) return reviewBriefV2();
        let current = -1;
        if (old?.kind === "questions") {
          let keys = new Set((old.questions || []).map((q) => q.question_key));
          current = steps.findIndex(
            (x) =>
              x.kind === "questions" &&
              (x.questions || []).some((q) => keys.has(q.question_key)),
          );
        } else if (old?.section)
          current = steps.findIndex(
            (x) => x.kind === "intro" && x.section === old.section,
          );
        if (current < 0)
          current = Math.max(
            0,
            Math.min(Number(bm.step) || 0, steps.length - 1),
          );
        if (delta > 0 && current >= steps.length - 1) return reviewBriefV2();
        let next = Math.max(0, Math.min(current + delta, steps.length - 1));
        if (delta > 0 && next === current && current < steps.length - 1)
          next = current + 1;
        bm.steps = steps;
        bm.step = next;
        let cur = steps[next];
        renderBriefV2();
        window.scrollTo(0, 0);
        try {
          await A("/api/client/progress", {
            method: "PUT",
            body: JSON.stringify({
              type: bm.type,
              id: bm.id,
              fill_mode: bm.mode,
              current_section: cur.section,
              current_question_key:
                cur.kind === "questions"
                  ? cur.questions[0]?.question_key
                  : null,
              current_step: next,
            }),
          });
        } catch (e) {
          console.warn("briefing progress save failed", e);
        }
      }
      async function reviewBriefV2() {
        let bm = S.bm,
          pending = Object.values(bm.pendingSaves || {});
        if (pending.length) await Promise.allSettled(pending);
        let rv = await A("/api/client/review?type=" + bm.type + "&id=" + bm.id),
          qs = relevantQuestionsV2(bm.b, bm.type, bm.mode),
          sections = [...new Set(qs.map((q) => q.section_name))].sort(
            (a, b) => {
              let o = sectionOrderV2(bm.type),
                ia = o.indexOf(a),
                ib = o.indexOf(b);
              return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
            },
          ),
          flagSet = new Set((rv.review_flags || []).map((x) => x.question_key)),
          missingSet = new Set((rv.missing || []).map((x) => x.question_key)),
          answer = (q) => {
            if (flagSet.has(q.question_key)) return "Para o time analisar";
            let v = bm.b.answers[q.question_key]?.value;
            if (Array.isArray(v)) return v.join(" · ");
            return filledV2(v) ? V(v) : "Não informado";
          };
        document.getElementById("app").innerHTML =
          '<main class="bmode review-mode">' +
          topV2({ section: "Revisão" }) +
          '<div class="review-shell"><header class="review-hero"><div class="v2-eyebrow">Revisão final</div><h1>Seu briefing está pronto para revisão.</h1><p>Confira por etapa. Você pode voltar direto para qualquer informação antes de enviar.</p></header><div class="review-groups">' +
          sections
            .map((s, si) => {
              let sq = qs.filter((q) => q.section_name === s),
                miss = sq.filter((q) => missingSet.has(q.question_key)).length,
                flags = sq.filter((q) => flagSet.has(q.question_key)).length,
                txt = miss
                  ? miss === 1
                    ? "1 obrigatória pendente"
                    : miss + " obrigatórias pendentes"
                  : flags
                    ? flags === 1
                      ? "1 informação para o time analisar"
                      : flags + " informações para o time analisar"
                    : "Completo",
                cl = miss ? "missing" : flags ? "warn" : "complete";
              return (
                '<details class="review-group ' +
                cl +
                '" ' +
                (si === 0 || miss ? "open" : "") +
                "><summary><span><b>" +
                E(s) +
                "</b><small>" +
                E(txt) +
                '</small></span><span class="review-status">' +
                (miss ? "!" : flags ? "○" : "✓") +
                '</span></summary><div class="review-answers">' +
                sq
                  .map(
                    (q) =>
                      '<button type="button" class="review-answer ' +
                      (missingSet.has(q.question_key) ? "is-missing" : "") +
                      '" data-edit-key="' +
                      E(q.question_key) +
                      '"><span>' +
                      E(q.label) +
                      "</span><b>" +
                      E(answer(q)) +
                      "</b></button>",
                  )
                  .join("") +
                "</div></details>"
              );
            })
            .join("") +
          "</div>" +
          (rv.missing.length
            ? '<section class="review-warning review-missing"><b>' +
              rv.missing.length +
              " " +
              (rv.missing.length === 1
                ? "informação obrigatória precisa"
                : "informações obrigatórias precisam") +
              " de resposta.</b><div>" +
              rv.missing
                .map(
                  (x) =>
                    '<button type="button" data-edit-key="' +
                    E(x.question_key) +
                    '">Responder ' +
                    E(x.label) +
                    "</button>",
                )
                .join("") +
              "</div></section>"
            : "") +
          (rv.review_flags.length
            ? '<section class="review-warning"><b>' +
              rv.review_flags.length +
              " " +
              (rv.review_flags.length === 1
                ? "informação será analisada"
                : "informações serão analisadas") +
              " pelo nosso time.</b></section>"
            : "") +
          '</div><footer class="bmode-actions"><button class="btn" id="reviewBack">← Voltar ao preenchimento</button><button class="btn primary" id="reviewSend" ' +
          (rv.missing.length ? "disabled" : "") +
          ">Enviar briefing</button></footer></main>";
        $("#reviewBack").onclick = () => renderBriefV2();
        $("#reviewSend").onclick = () => submitBriefV2();
        $$("[data-edit-key]").forEach(
          (bt) =>
            (bt.onclick = () => {
              let ix = bm.steps.findIndex((x) =>
                x.questions?.some((q) => q.question_key === bt.dataset.editKey),
              );
              bm.step = ix >= 0 ? ix : 0;
              renderBriefV2();
              setTimeout(() => {
                $('[data-qcard="' + bt.dataset.editKey + '"]')?.scrollIntoView({
                  behavior: "smooth",
                  block: "center",
                });
              }, 30);
            }),
        );
      }
      async function submitBriefV2() {
        let bm = S.bm,
          bt = $("#reviewSend");
        if (bt) {
          bt.disabled = true;
          bt.textContent = "Enviando…";
        }
        try {
          let r = await A("/api/client/submit", {
            method: "POST",
            body: JSON.stringify({ type: bm.type, id: bm.id }),
          });
          invalidateClientCache();
          bm.progress = {
            ...(bm.progress || {}),
            submitted_at: r.submitted_at,
          };
          summaryBriefV2();
        } catch (e) {
          if (bt) {
            bt.disabled = false;
            bt.textContent = "Enviar briefing";
          }
          alert("Ainda existe uma informação obrigatória pendente.");
        }
      }
      function summaryItemV2(label, v) {
        if (!filledV2(v)) return "";
        return (
          '<div class="summary-item"><small>' +
          E(label) +
          "</small><b>" +
          E(V(v)) +
          "</b></div>"
        );
      }
      function summaryBriefV2() {
        let bm = S.bm,
          a = valsV2(bm.b),
          items =
            bm.type === "PRODUCT"
              ? [
                  ["Tipo", a["product.type"]],
                  ["Localização", a["product.location"]],
                  ["Preço", a["product.price"]],
                  ["Diferenciais", a["product.differentials"]],
                  ["Motivos de compra", a["product.buy_reason"]],
                  ["Condições", a["product.special_offer"]],
                ]
              : [
                  ["Intenção", a["persona.intent"]],
                  ["Faixa etária", a["persona.age_range"]],
                  ["Renda", a["persona.income_range"]],
                  ["Região de origem", a["persona.location"]],
                  ["Desejos", a["persona.desires"]],
                  ["Objeções", a["persona.objections"]],
                ],
          sent = bm.progress?.submitted_at
            ? F(bm.progress.submitted_at)
            : F(new Date().toISOString());
        document.getElementById("app").innerHTML =
          '<main class="mode-choose"><section class="mode-box summary-page v2-fade"><div class="success-check">✓</div><div class="v2-eyebrow" style="margin-top:18px">Briefing recebido</div><h1>Enviado com sucesso.</h1><p>Nosso time já pode usar essas informações para estruturar as próximas etapas.</p><div class="summary-card"><div class="project-card-head"><div><div class="v2-eyebrow">' +
          (bm.type === "PRODUCT" ? "Produto" : "Persona") +
          "</div><h2>" +
          E(bm.b.entity.name) +
          "</h2><small>Enviado em " +
          E(sent) +
          '</small></div><span class="pill status-ok">Recebido ✓</span></div><div class="summary-grid">' +
          items.map((x) => summaryItemV2(x[0], x[1])).join("") +
          "</div>" +
          (bm.files.length
            ? '<p class="muted" style="margin-top:14px">' +
              bm.files.length +
              " " +
              (bm.files.length === 1
                ? "arquivo anexado"
                : "arquivos anexados") +
              "</p>"
            : "") +
          '</div><div class="summary-actions"><button class="btn primary" id="sumProjects">Voltar aos meus projetos</button><button class="btn" id="sumReview">Visualizar resumo</button><a class="btn pdf-action" href="/api/client/pdf?type=' +
          bm.type +
          "&id=" +
          bm.id +
          '" download>↓ Baixar PDF</a></div></section></main>';
        $("#sumProjects").onclick = () => clientShell("home");
        $("#sumReview").onclick = () => reviewBriefV2();
      }
      async function client(cid) {
        S.cid = cid;
        let r = await A("/api/staff/client?id=" + cid),
          view = document.getElementById("view");
        view.innerHTML =
          '<div class="row between"><div><button class="btn" id="back">← Clientes</button><h2>' +
          E(r.client.name) +
          '</h2></div><div class="row"><button class="btn" id="brand">Marca e Mercado</button><button class="btn" id="access">Acesso cliente</button><button class="btn primary" id="np">+ Produto</button><button class="btn" id="ne">+ Persona</button></div></div><h3>Produtos</h3><div class="grid cards">' +
          r.products
            .map(
              (p) =>
                '<div class="card"><div class="row between"><b>' +
                E(p.name) +
                "</b>" +
                pill(p.briefing_status) +
                '</div><div class="row" style="margin-top:10px"><button class="btn" data-po="' +
                p.id +
                '">Abrir</button><button class="btn" data-li="' +
                p.id +
                '">Vincular Persona</button></div></div>',
            )
            .join("") +
          '</div><h3>Personas</h3><div class="grid cards">' +
          r.personas
            .map(
              (p) =>
                '<div class="card"><div class="row between"><b>' +
                E(p.name) +
                "</b>" +
                pill(p.status) +
                '</div><button class="btn" data-pe="' +
                p.id +
                '">Abrir</button></div>',
            )
            .join("") +
          '</div><h3>Acessos</h3><div class="card"><table><tr><th>Nome</th><th>Usuário</th><th>ÃÂÃÂltimo acesso</th></tr>' +
          r.users
            .map(
              (u) =>
                "<tr><td>" +
                E(u.display_name) +
                "</td><td><code>" +
                E(u.username || "—") +
                "</code></td><td>" +
                F(u.last_login_at) +
                "</td></tr>",
            )
            .join("") +
          "</table></div>";
        document.getElementById("back").onclick = () => staffView("clients");
        document.getElementById("brand").onclick = () => accountView(cid);
        document.getElementById("np").onclick = () =>
          create("products", cid, "Nome do produto");
        document.getElementById("ne").onclick = () =>
          create("personas", cid, "Nome da persona");
        $$("[data-po]").forEach(
          (b) => (b.onclick = () => open("PRODUCT", b.dataset.po)),
        );
        $$("[data-pe]").forEach(
          (b) => (b.onclick = () => open("PERSONA", b.dataset.pe)),
        );
        $$("[data-li]").forEach(
          (b) => (b.onclick = () => link(b.dataset.li, r.personas)),
        );
        document.getElementById("access").onclick = () => {
          let m = modal(
            '<h2>Criar acesso do cliente</h2><form id="af" class="grid"><input name="display_name" placeholder="Nome"><input name="username" placeholder="Usuário (sem espaÃÂÃÂ§os)" required><input name="password" placeholder="Senha temporária" minlength="8" required><button class="btn primary">Criar</button></form>',
          );
          document.getElementById("af").onsubmit = async (e) => {
            e.preventDefault();
            let b = Object.fromEntries(new FormData(e.target));
            b.client_id = cid;
            await A("/api/staff/client-user", {
              method: "POST",
              body: JSON.stringify(b),
            });
            m.remove();
            client(cid);
          };
        };
      }
      async function staffView(v) {
        let o = await A("/api/staff/overview"),
          view = document.getElementById("view");
        if (v === "clients") {
          view.innerHTML =
            '<div class="row between"><input id="search" placeholder="Buscar cliente ou empreendimento"><button class="btn primary" id="nc">+ Cliente</button></div><div class="card" style="margin-top:14px"><table><tr><th>Cliente</th><th>Produtos</th><th>Personas</th><th></th></tr>' +
            o.clients
              .map(
                (c) =>
                  "<tr><td><b>" +
                  E(c.name) +
                  "</b></td><td>" +
                  c.product_count +
                  "</td><td>" +
                  c.persona_count +
                  '</td><td><button class="btn" data-c="' +
                  c.id +
                  '">Abrir</button></td></tr>',
              )
              .join("") +
            "</table></div>";
          $$("[data-c]").forEach(
            (b) => (b.onclick = () => client(b.dataset.c)),
          );
          document.getElementById("search").oninput = async (e) => {
            let x = await A(
              "/api/staff/overview?q=" + encodeURIComponent(e.target.value),
            );
            let tb = $("table");
            tb.innerHTML =
              "<tr><th>Cliente</th><th>Produtos</th><th>Personas</th><th></th></tr>" +
              x.clients
                .map(
                  (c) =>
                    "<tr><td><b>" +
                    E(c.name) +
                    "</b></td><td>" +
                    c.product_count +
                    "</td><td>" +
                    c.persona_count +
                    '</td><td><button class="btn" data-c="' +
                    c.id +
                    '">Abrir</button></td></tr>',
                )
                .join("");
            $$("[data-c]").forEach(
              (b) => (b.onclick = () => client(b.dataset.c)),
            );
          };
          document.getElementById("nc").onclick = () => {
            let m = modal(
              '<h2>Novo cliente</h2><form id="nf" class="grid"><input name="name" placeholder="Cliente / imobiliária" required><button class="btn primary">Criar</button></form>',
            );
            document.getElementById("nf").onsubmit = async (e) => {
              e.preventDefault();
              let r = await A("/api/staff/clients", {
                method: "POST",
                body: JSON.stringify(
                  Object.fromEntries(new FormData(e.target)),
                ),
              });
              m.remove();
              client(r.id);
            };
          };
        } else {
          view.innerHTML =
            '<h2>Atualizações recentes</h2><div class="card history">' +
            o.recent
              .map(
                (x) =>
                  '<div class="hist"><b>' +
                  E(x.client_name) +
                  " · " +
                  E(x.entity_name) +
                  " · " +
                  E(x.question_key) +
                  '</b><div class="muted">' +
                  F(x.changed_at) +
                  " · " +
                  E(x.changed_by_name || x.changed_by_type) +
                  "</div><div>" +
                  E(V(x.old_value)) +
                  " → <b>" +
                  E(V(x.new_value)) +
                  "</b></div></div>",
              )
              .join("") +
            "</div>";
        }
      }
      async function init() {
        try {
          if (M === "STAFF" && location.hash.startsWith("#access_token=")) {
            let t = decodeURIComponent(location.hash.slice(14));
            history.replaceState(null, "", location.pathname);
            await A("/api/staff/sso", {
              method: "POST",
              body: JSON.stringify({ access_token: t }),
            });
          }
          let m = await A(
            "/api/" + (M === "STAFF" ? "staff" : "client") + "/me",
          );
          if (M === "CLIENT" && m.user.must_change_password) {
            document.getElementById("app").innerHTML =
              '<div class="login"><div class="card"><h2>Crie sua nova senha</h2><form id="pw" class="grid"><input name="password" type="password" minlength="8" required><button class="btn primary">Salvar</button></form></div></div>';
            document.getElementById("pw").onsubmit = async (e) => {
              e.preventDefault();
              await A("/api/client/password", {
                method: "POST",
                body: JSON.stringify(
                  Object.fromEntries(new FormData(e.target)),
                ),
              });
              location.reload();
            };
            return;
          }
          shell();
          if (M === "CLIENT") {
            S.me = m.user;
            let qp = new URLSearchParams(location.search),
              bt = String(qp.get("briefType") || "").toUpperCase(),
              bi = qp.get("briefId");
            if ((bt === "PRODUCT" || bt === "PERSONA") && bi)
              briefingMode(bt, bi, {
                review: qp.get("review") === "1",
                summary: qp.get("summary") === "1",
              });
            else {
              let tv = String(qp.get("tab") || "home"),
                allowed = [
                  "home",
                  "products",
                  "personas",
                  "materials",
                  "drive",
                  "integrations",
                  "history",
                ];
              clientShell(allowed.includes(tv) ? tv : "home");
            }
          } else {
            buildNav(
              [
                ["clients", "Clientes"],
                ["recent", "Atualizações"],
              ],
              staffView,
            );
            staffView("clients");
          }
        } catch {
          login();
        }
      }
      init();
    </script>
  </body>
</html>

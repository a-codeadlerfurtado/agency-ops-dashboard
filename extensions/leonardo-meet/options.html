<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leonardo Meetings</title>
  <style>
    body{margin:0;background:#0b1014;color:#edf4f8;font:14px Inter,system-ui,sans-serif}
    main{max-width:560px;margin:64px auto;padding:28px;border:1px solid #2e3a43;border-radius:18px;background:#11171b}
    h1{margin:0 0 8px;font-size:26px} p{color:#9eacb7;line-height:1.5}
    label{display:block;margin:22px 0 8px;font-weight:700} input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #34414b;background:#090d10;color:#fff;font-size:18px;letter-spacing:.12em;text-transform:uppercase}
    button{margin-top:12px;padding:11px 15px;border:0;border-radius:10px;background:#ff7a2f;color:#fff;font-weight:800;cursor:pointer}
    #status{margin-top:16px;min-height:22px}.ok{color:#8fd2ff}.error{color:#ff8c8c}
  </style>
</head>
<body>
  <main>
    <h1>Leonardo Meetings</h1>
    <p>Conecte este Chrome ao seu perfil do Dashboard uma única vez. Depois disso, as reuniões do Google Meet são capturadas automaticamente.</p>
    <label for="code">Código de conexão</label>
    <input id="code" maxlength="12" autocomplete="off" placeholder="ABCDEFGH" />
    <button id="connect" type="button">Conectar este Chrome</button>
    <div id="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
